<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- 资源预取与预连接优化 (使用国内镜像加速) -->
    <link rel="dns-prefetch" href="//fonts.googleapis.com">
    <link rel="dns-prefetch" href="//fonts.gstatic.com">
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdn.blockofhome.cn" crossorigin>
    <!-- Google Fonts 预加载（替代 CSS @import，避免阻塞渲染） -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap"></noscript>
    <!-- PWA 兼容性 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="BOH">

    <!-- Favicon设置 -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/favicon.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/favicon.png"
    />
    <link rel="mask-icon" href="/favicon.png" color="#42b983" />
    <link rel="shortcut icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Block of Home</title>
  </head>
  <body>
    <div id="app"></div>
    <!-- mcdmsc.js 已移除，BOH服务器端口号通过其他方式获取 -->
    <script type="module" src="src/main.js"></script>
  </body>
</html>
