<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- 资源预取与预连接优化 (使用国内镜像加速) -->
    <link rel="dns-prefetch" href="//fonts.googleapis.com">
    <link rel="dns-prefetch" href="//fonts.gstatic.com">
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdn.blockofhome.cn" crossorigin>
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin>
    <link rel="dns-prefetch" href="//agent.wzbc.edu.cn">
    <link rel="preconnect" href="https://agent.wzbc.edu.cn" crossorigin>
    <!-- Google Fonts 预加载（替代 CSS @import，避免阻塞渲染） -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap"></noscript>
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"></noscript>
    <!-- PWA 兼容性 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="BOH">
    <meta name="theme-color" content="#79a947">

    <!-- Favicon设置 -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/favicon.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/favicon.png"
    />
    <link rel="mask-icon" href="/favicon.png" color="#42b983" />
    <link rel="shortcut icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Block of Home</title>

    <!-- 强制清除旧 Service Worker 的最早执行脚本 -->
    <script>
      (function() {
        // 检测强制更新 URL 参数
        if (window.location.search.includes('forceUpdate=true') ||
            window.location.search.includes('clearCache=true')) {
          console.log('[PWA] 检测到强制更新参数，开始清除缓存');

          var cleanUrl = window.location.pathname + window.location.hash;

          // SW 注销任务（不支持 SW 时返回空数组）
          var swTask = ('serviceWorker' in navigator)
            ? navigator.serviceWorker.getRegistrations().then(function(registrations) {
                console.log('[PWA] 找到 ' + registrations.length + ' 个 Service Worker 注册');
                return Promise.all(registrations.map(function(registration) {
                  return registration.unregister().then(function() {
                    console.log('[PWA] 已注销 Service Worker: ' + registration.scope);
                  });
                }));
              })
            : Promise.resolve([]);

          // Cache Storage 清除任务（不支持时跳过，仅清理 SW 后重定向）
          var cacheTask = ('caches' in window)
            ? caches.keys().then(function(cacheNames) {
                console.log('[PWA] 找到 ' + cacheNames.length + ' 个缓存');
                return Promise.all(cacheNames.map(function(cacheName) {
                  console.log('[PWA] 删除缓存: ' + cacheName);
                  return caches.delete(cacheName);
                }));
              })
            : Promise.resolve([]);

          // 合并为单条 Promise 链，等待 SW 注销与缓存清除全部完成后再重定向，
          // 避免重定向先于 SW 注销发生
          Promise.all([swTask, cacheTask]).then(function() {
            console.log('[PWA] 所有缓存已清除');
            console.log('[PWA] 重定向到: ' + cleanUrl);
            window.location.replace(cleanUrl);
          }).catch(function(err) {
            console.error('[PWA] 清理失败:', err);
            // 即使失败也尝试重定向
            window.location.replace(cleanUrl);
          });
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <!-- mcdmsc.js 已移除，BOH服务器端口号通过其他方式获取 -->
    <script type="module" src="src/main.js"></script>
  </body>
</html>
