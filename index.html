<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!--
      早期主题应用（必须早于骨架样式生效、早于任何模块脚本执行）
      骨架的暗色分支与 body 兜底底色都依赖 html[data-theme]，而主题管理器
      （src/utils/theme-manager.js）是在应用挂载之后才 init，暗色主题 CSS 更是
      懒加载 —— 不提前设属性，暗色用户会先看到整屏白再切黑。
      注意：VALID_THEMES 与 theme-manager.js 的同名常量重复（这里必须早于
      模块执行，无法 import）。两处必须同步修改，由 scripts/check-first-paint.mjs 断言。
    -->
    <script>
      (function () {
        var VALID_THEMES = ['light', 'dark', 'system', 'home-cat', 'anniversary-mc'];
        try {
          var saved = localStorage.getItem('boh-theme');
          var pref = VALID_THEMES.indexOf(saved) >= 0 ? saved : 'light';
          var theme = pref === 'system'
            ? (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
            : pref;
          var root = document.documentElement;
          root.setAttribute('data-theme', theme);
          root.classList.toggle('dark', theme === 'dark');
        } catch (e) { /* localStorage 不可用（隐私模式等）时按浅色默认走 */ }
      })();
    </script>
    <!-- 资源预取与预连接优化 (使用国内镜像加速) -->
    <link rel="preconnect" href="https://cdn.blockofhome.cn" crossorigin>

    <!-- 首屏使用系统字体栈；低优先级页面字体不得争抢首屏连接。 -->
    <!-- PWA 兼容性 -->
    <!-- 2026-09-24：补 mobile-web-app-capable（新版 Chrome/Android 的标准名，消除弃用告警）；
         apple-* 一条保留 —— 旧版 iOS Safari 仍只认它。 -->

      苹果周围一圈会变黑。icon-180.png 是带白底、已按安全区缩好的版本。

    <!--
      SEO / 分享预览基建（2026-10-17 全面审查 P1-4）
      背景：此前 index.html 只有 <title>，没有 description / OG / canonical / robots ——
      分享到微信、飞书、Discord 时一律是「一个裸链接」，搜索引擎也没有可用的摘要。
      ⚠️ 口径与限制：
        · 站点是 **hash 路由**（`/#/about` 这种），静态 HTML 只有一份。这里给的是
          「整站级」元信息，不会随路由变化 —— 想让 /about、/newsroom 各自有标题和摘要，
          需要预渲染（vite-plugin-ssg 或边缘侧渲染），那是中期项，不在本次范围内。
        · canonical 指向站点根：hash 之后的路径对爬虫等价于同一个文档，逐个写 canonical
          反而会被判为重复内容。
        · og:image 暂时复用 PWA 图标（512×512，方形）。理想尺寸是 1200×630，

    <!--
      首屏启动骨架（纯内联，零额外请求）
      背景：#app 原本是空的，应用壳（app-*.js + ui-components 等）下载执行期间，
      导航栏所在 chunk 先到就先渲染，主体区则是一片空白。这段骨架把那段窗口
      变成可见内容，并把首帧提前到 HTML 解析完成时（不等任何 JS）。
      ⚠️ 刻意不画「假导航栏」：真实导航栏由 ui-components 提供且已在 SW 预缓存内
      （实测约 90ms 就位），而假胶囊与真实导航栏（默认全宽白条 1280×72；滚动后
      860×58 圆角玻璃）几何与视觉都对不上，反而制造一次形态跳变。骨架只负责主体区。
      骨架阶段视口内没有导航栏，内容整屏居中；App.vue 的加载态因真实导航栏已存在，
      改用 .boh-boot-body--standalone（60vh 居中），这是两者唯一的形态差异。
      生命周期：Vue 挂载 #app 时会整体替换容器内容，骨架自动消失，无需关闭逻辑。
    -->
    <style>
      /* 骨架期间的底色兜底：暗色主题 CSS（src/styles/themes/dark-mode.css）是
         懒加载的，在它到位前 body 会沿用 src/style.css 的兜底色。这里用与
         dark-mode.css 相同特异性的选择器先垫一层，应用 CSS 加载后由后者接管。
         2026-09-23：页面底色改回纯白（--boh-page-bg = #ffffff）；暗色仍是暖炭
         #16120e。骨架必须跟同一 token 走，否则启动瞬间有一次底色跳变。
         scripts/check-first-paint.mjs 会比对这里的值 === tokens.css / dark-mode.css
         的 --boh-page-bg。 */
      [data-theme="dark"] { background-color: #16120e; }
      [data-theme="dark"] body { background-color: #16120e; }

      .boh-boot {
        box-sizing: border-box;
        min-height: 100vh;
        background: #ffffff;
        display: flex;
        flex-direction: column;
      }
      [data-theme="dark"] .boh-boot { background: #16120e; }

      .boh-boot-body {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding: 0 24px 12vh;
      }
      .boh-boot-body--standalone { min-height: 60vh; }

      .boh-boot-dots { display: flex; gap: 7px; }
      .boh-boot-dots span {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #c7c7cc;
        animation: boh-boot-bounce 1.2s ease-in-out infinite;
      }
      [data-theme="dark"] .boh-boot-dots span { background: #5d5d67; }
      .boh-boot-dots span:nth-child(2) { animation-delay: 0.15s; }
      .boh-boot-dots span:nth-child(3) { animation-delay: 0.3s; }

      @keyframes boh-boot-bounce {
        0%, 80%, 100% { transform: translateY(0); opacity: 0.45; }
        40% { transform: translateY(-5px); opacity: 1; }
      }

      .boh-boot-text {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        font-size: 14px;
        line-height: 1.6;
        color: #8b9098;
      }
      /* --liquid-text-tertiary：浅 #8b9098 / 暗 #8a919c（tokens.css） */
      [data-theme="dark"] .boh-boot-text { color: #8a919c; }

      .boh-boot-retry {
        margin-top: 2px;
        padding: 9px 22px;
        border: 1px solid rgba(0, 0, 0, 0.12);
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.04);
        color: #1d1d1f;
        font-family: inherit;
        font-size: 14px;
        cursor: pointer;
      }
      [data-theme="dark"] .boh-boot-retry {
        border-color: rgba(255, 255, 255, 0.18);
        background: rgba(255, 255, 255, 0.08);
        color: #f5f5f7;
      }

      /* ===== 超时三态（2026-10-19）：与 src/App.vue boot 分支同类名，改这里必须同步 =====
         参数与 docs/demos/boot-timeout-fallback-demo.html 一致（240ms rise / 180ms 收场 /
         1.4s 流光）。此处刻意不引 tokens.css —— 骨架原则：不依赖任何可能失败的 CSS。
         ⚠️ 本文件不进 prettier（lint-staged 不含 html），属性选择器保持双引号 ——
         check-first-paint 按字面匹配 [data-theme="dark"]，别改成单引号。 */
      .boh-boot-progress {
        position: relative;
        width: 76px;
        height: 2px;
        border-radius: 2px;
        overflow: hidden;
        background: rgba(127, 127, 135, 0.18);
      }
      .boh-boot-progress::after {
        content: "";
        position: absolute;
        top: 0;
        bottom: 0;
        left: 27%;
        width: 45%;
        border-radius: 2px;
        background: linear-gradient(90deg, transparent, #79a947, transparent);
        animation: boh-boot-sweep 1.4s ease-in-out infinite;
      }
      @keyframes boh-boot-sweep {
        from { transform: translateX(-110%); }
        to { transform: translateX(320%); }
      }

      /* 报错态：加载点整体淡出收场（停止「假加载」信号）；淡出后留位，不制造布局跳动 */
      .boh-boot-body.is-error .boh-boot-dots { animation: boh-boot-dots-out 0.18s ease-out both; }
      @keyframes boh-boot-dots-out {
        from { opacity: 1; transform: translateY(0); }
        to { opacity: 0; transform: translateY(4px); }
      }

      /* Vue <Transition name="boh-boot-dots"> 的离场类（src/App.vue）：点只在加载态存在，
         离场淡出下沉 180ms 后卸载 —— 「更新中」态因此没有跳动点，只有文案 + 流光细线 */
      .boh-boot-dots-leave-active {
        transition: opacity 0.18s ease-out, transform 0.18s ease-out;
      }
      .boh-boot-dots-leave-to {
        opacity: 0;
        transform: translateY(4px);
      }

      /* 报错态间距整体放松（demo 二轮反馈：有点拥挤） */
      .boh-boot-body.is-error { gap: 20px; }

      /* 报错徽标：软圆底 + 感叹号（图形语言同 GlobalErrorBoundary），currentColor 自动适配暗色 */
      .boh-boot-badge {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        border: 1px solid rgba(0, 0, 0, 0.1);
        background: rgba(0, 0, 0, 0.03);
        color: #8b9098;
      }
      [data-theme="dark"] .boh-boot-badge {
        border-color: rgba(255, 255, 255, 0.16);
        background: rgba(255, 255, 255, 0.06);
        color: #8a919c;
      }

      /* 报错元素错峰入场（一次性 rise + fade） */
      .boh-boot-rise-1 { animation: boh-boot-rise 0.24s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
      .boh-boot-rise-2 { animation: boh-boot-rise 0.24s cubic-bezier(0.2, 0.8, 0.2, 1) 0.06s both; }
      .boh-boot-rise-3 { animation: boh-boot-rise 0.24s cubic-bezier(0.2, 0.8, 0.2, 1) 0.12s both; }
      @keyframes boh-boot-rise {
        from { opacity: 0; transform: translateY(6px) scale(0.98); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }

      /* 报错文案两行拆分：主行加重（近似 --liquid-text-secondary 的骨架内联值） */
      .boh-boot-text strong {
        display: block;
        margin-bottom: 4px;
        font-size: 15px;
        font-weight: 600;
        color: #3c3c43;
      }
      [data-theme="dark"] .boh-boot-text strong { color: #d1d1d6; }
      .boh-boot-hint { margin-top: -6px; font-size: 12px; opacity: 0.75; }

      /* 报错态主按钮：实心（对比基础幽灵样式提高可点性；基础 .boh-boot-retry 保持原样，
         check-first-paint 比对的是基础类，别动它的 color） */
      .boh-boot-retry--primary {
        border-color: transparent;
        background: #1d1d1f;
        color: #ffffff;
      }
      [data-theme="dark"] .boh-boot-retry--primary { background: #f5f5f7; color: #1d1d1f; }

      /* 内联报错组的布局与显隐（[hidden] 要显式压回 display:none，否则上面的 flex 会顶掉它） */
      .boh-boot-error {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
      }
      .boh-boot-error[hidden] { display: none; }

      @media (prefers-reduced-motion: reduce) {
        .boh-boot-dots span { animation: none; opacity: 0.7; }
        .boh-boot-dots-leave-active { transition: none; }
        .boh-boot-body.is-error .boh-boot-dots { animation: none; opacity: 0; }
        .boh-boot-progress::after { animation: none; opacity: 0.6; }
        .boh-boot-badge,
        .boh-boot-rise-1,
        .boh-boot-rise-2,
        .boh-boot-rise-3 { animation: none; }
      }
    </style>

    <!-- 强制清除旧 Service Worker 的最早执行脚本 -->
    <script>
      (function() {
        // 检测强制更新 URL 参数
        if (window.location.search.includes('forceUpdate=true') ||
            window.location.search.includes('clearCache=true')) {
          console.log('[PWA] 检测到强制更新参数，开始清除缓存');

          // 保留资源恢复标记。该标记会让 CDN 将这次导航视为新请求，避免在
          // 刚发布后再次拿到仍引用已删除 hash 资源的旧 index.html。
          var cleanUrl = new URL(window.location.href);
          cleanUrl.searchParams.delete('forceUpdate');
          cleanUrl.searchParams.delete('clearCache');

          // SW 注销任务（不支持 SW 时返回空数组）
          var swTask = ('serviceWorker' in navigator)
            ? navigator.serviceWorker.getRegistrations().then(function(registrations) {
                console.log('[PWA] 找到 ' + registrations.length + ' 个 Service Worker 注册');
                return Promise.all(registrations.map(function(registration) {
                  return registration.unregister().then(function() {
                    console.log('[PWA] 已注销 Service Worker: ' + registration.scope);
                  });
                }));
              })
            : Promise.resolve([]);

          // Cache Storage 清除任务（不支持时跳过，仅清理 SW 后重定向）
          var cacheTask = ('caches' in window)
            ? caches.keys().then(function(cacheNames) {
                console.log('[PWA] 找到 ' + cacheNames.length + ' 个缓存');
                return Promise.all(cacheNames.map(function(cacheName) {
                  console.log('[PWA] 删除缓存: ' + cacheName);
                  return caches.delete(cacheName);
                }));
              })
            : Promise.resolve([]);

          // 合并为单条 Promise 链，等待 SW 注销与缓存清除全部完成后再重定向，
          // 避免重定向先于 SW 注销发生
          Promise.all([swTask, cacheTask]).then(function() {
            console.log('[PWA] 所有缓存已清除');
            console.log('[PWA] 重定向到: ' + cleanUrl);
            window.location.replace(cleanUrl.href);
          }).catch(function(err) {
            console.error('[PWA] 清理失败:', err);
            // 即使失败也尝试重定向
            window.location.replace(cleanUrl.href);
          });
        }
      })();
    </script>
    <!--
      GitHub Pages 发布会替换带 hash 的构建文件，但旧 index.html 可能仍被
      CDN 或浏览器短暂缓存。若它引用的 CSS/应用入口已不存在，自动清除
      PWA 缓存并使用唯一 URL 请求最新入口，避免页面退化为默认浏览器样式。
    -->
    <script>
      (function () {
        var recoveryParam = 'bohAssetRecovery';
        var hasRecovered = new URL(window.location.href).searchParams.has(recoveryParam);

        window.addEventListener('error', function (event) {
          if (hasRecovered) return;

          var target = event.target;
          var isStylesheet = target && target.tagName === 'LINK' && target.rel === 'stylesheet';
          var isAppModule = target && target.tagName === 'SCRIPT' && target.type === 'module';
          var assetUrl = target && (target.href || target.src);

          if ((!isStylesheet && !isAppModule) || !assetUrl || assetUrl.indexOf('/static/') === -1) return;

          var recoveryUrl = new URL(window.location.href);
          recoveryUrl.searchParams.set('forceUpdate', 'true');
          recoveryUrl.searchParams.set(recoveryParam, Date.now().toString());
          window.location.replace(recoveryUrl.href);
        }, true);

        // 成功恢复后移除 URL 中的内部标记，避免影响分享和普通导航。
        if (hasRecovered && window.history && window.history.replaceState) {
          window.addEventListener('load', function () {
            var cleanUrl = new URL(window.location.href);
            cleanUrl.searchParams.delete(recoveryParam);
            window.history.replaceState(null, '', cleanUrl.href);
          }, { once: true });
        }
      }());
    </script>
  </head>
  <body>
    <div id="app">
      <div class="boh-boot" id="boh-boot">
        <div class="boh-boot-body" id="boh-boot-body">
          <div class="boh-boot-dots" id="boh-boot-dots" aria-hidden="true"><span></span><span></span><span></span></div>
          <p class="boh-boot-text" id="boh-boot-text">正在加载…</p>
          <!-- 超时报错组：预置在 DOM 里，12s 兜底脚本揭晓（display 切换会重放入场动画）。
               文案/类名与 src/App.vue 的 10s 兜底保持一致，改一处必须同步另一处。 -->
          <div class="boh-boot-error" id="boh-boot-error" hidden>
            <div class="boh-boot-badge boh-boot-rise-1" aria-hidden="true">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10" />
                <line x1="12" y1="8" x2="12" y2="12" />
                <line x1="12" y1="16" x2="12.01" y2="16" />
              </svg>
            </div>
            <p class="boh-boot-text boh-boot-rise-2"><strong>加载超时</strong>可能是网络不稳定，或刚刚发布了新版本</p>
            <button class="boh-boot-retry boh-boot-retry--primary boh-boot-rise-3" id="boh-boot-retry" type="button">重新加载</button>
            <p class="boh-boot-text boh-boot-hint boh-boot-rise-3">将清除旧缓存并获取最新版本</p>
          </div>
        </div>
      </div>
    </div>
    <!-- mcdmsc.js 已移除，BOH服务器端口号通过其他方式获取 -->
    <script type="module" src="src/main.js"></script>
    <script>
      // 启动骨架超时兜底：12s 后若 #app 仍未被 Vue 接管（骨架节点还在 DOM 里），
      // 说明应用壳或路由 chunk 没到位（常见于刚发布后旧 hash 已 404），
      // 给出一个可点的自救入口。纯内联、零网络请求；Vue 一旦挂载即自然失效。
      // ⚠️ 这里是"Vue 完全没起来"的兜底；src/App.vue 另有一道 10s 兜底负责
      // "Vue 已挂载但路由 chunk 没到位"。两处文案与超时长度必须同步修改。
      (function () {
        var boot = document.getElementById('boh-boot');
        var body = document.getElementById('boh-boot-body');
        var dotsRow = document.getElementById('boh-boot-dots');
        var loadingText = document.getElementById('boh-boot-text');
        var errorBox = document.getElementById('boh-boot-error');
        var retry = document.getElementById('boh-boot-retry');
        if (!boot || !retry) return;

        var timer = window.setTimeout(function () {
          if (!document.body.contains(boot)) return;
          // ⚠️ 这里只切到「报错态」，不做自动强刷：内联环境拿不到 version-checker，
          // 手写第二份「拉 version.json 比对构建指纹」会违反单一真源；且入口脚本/CSS
          // 的 404 已由上方资源监听自动强刷覆盖，能活到 12s 的残留场景（Vue 完全没挂载）
          // 极少，保留手动自救即可。自动强刷由 src/App.vue 的 10s 兜底负责
          // （recoverIfStaleBuild → forceCleanAndReload）。
          // ⚠️ 文案与 src/App.vue 超时分支保持一致，改一处必须同步另一处。
          if (loadingText) loadingText.hidden = true;
          if (errorBox) errorBox.hidden = false;
          if (body) body.classList.add('is-error');
          // 点淡出收场（0.18s，见 .boh-boot-body.is-error 规则）后从布局中收起；
          // 这块骨架的报错态是终态、不会再回到加载态，收起是安全的
          if (dotsRow) window.setTimeout(function () { dotsRow.style.display = 'none'; }, 220);
        }, 12000);

        retry.addEventListener('click', function () {
          if (retry.disabled) return;
          retry.disabled = true;
          // forceUpdate 会触发上方内联脚本的 SW 注销 + 缓存清理流程
          var url = new URL(window.location.href);
          url.searchParams.set('forceUpdate', 'true');
          window.location.replace(url.href);
        });

        window.__bohBootSkeletonTimer = timer;
      })();
    </script>
  </body>
</html>
