<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- 资源预取与预连接优化 (使用国内镜像加速) -->
    <link rel="dns-prefetch" href="//fonts.loli.net">
    <link rel="dns-prefetch" href="//gstatic.loli.net">
    <link rel="preconnect" href="https://fonts.loli.net" crossorigin>
    <link rel="preconnect" href="https://gstatic.loli.net" crossorigin>

    <!-- 预加载关键字体 -->
    <link rel="preload" href="/src/assets/fonts/icomoon.woff" as="font" type="font/woff" crossorigin>
    
    <!-- Favicon设置 -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/favicon.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/favicon.png"
    />
    <link rel="mask-icon" href="/favicon.png" color="#42b983" />
    <link rel="shortcut icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Block of Home</title>
  </head>
  <body>
    <div id="app"></div>
    <!-- 引入mcdmsc.js文件，用于获取BOH服务器端口号 -->
    <script type="module" src="/mcdmsc.js"></script>

    <script type="module" src="src/main.js"></script>
  </body>
</html>
