<title>BOH 数据导出预览 · 液态玻璃 Demo</title>
<style>
/* ============================================================
   BOH 数据导出预览 — 设计 Demo
   视觉基准：站点 tokens.css 的 --liquid-* 液态玻璃体系
   结构基准：Forum/PostCard.vue 的卡片骨架
   说明：最终版由 Edge Function 生成进 ZIP 内 index.html，
        本文件的渲染逻辑与样式即未来 previewHtml 的蓝本。
   ============================================================ */

:root{
  color-scheme:light dark;
  /* —— 液态玻璃 token（与 src/styles/common/tokens.css 同源）—— */
  --liquid-bg:rgba(255,255,255,.72);
  --liquid-bg-strong:rgba(255,255,255,.84);
  --liquid-bg-subtle:rgba(255,255,255,.58);
  --liquid-bg-nested:rgba(255,255,255,.42);
  --liquid-border:rgba(255,255,255,.65);
  --liquid-border-strong:rgba(255,255,255,.82);
  --liquid-border-hairline:rgba(15,23,42,.06);
  --liquid-blur:28px;--liquid-blur-sm:18px;--liquid-blur-lg:36px;
  --liquid-saturate:180%;
  --liquid-filter:blur(var(--liquid-blur)) saturate(var(--liquid-saturate)) brightness(1.02);
  --liquid-filter-sm:blur(var(--liquid-blur-sm)) saturate(var(--liquid-saturate)) brightness(1.02);
  --liquid-highlight:inset 0 1px 0 rgba(255,255,255,.86);
  --liquid-highlight-subtle:inset 0 1px 0 rgba(255,255,255,.55);
  --liquid-shadow:0 20px 60px rgba(15,23,42,.07),0 1px 3px rgba(15,23,42,.06);
  --liquid-shadow-sm:0 8px 24px rgba(15,23,42,.06);
  --liquid-shadow-overlay:0 24px 80px rgba(15,23,42,.14);
  --liquid-radius-lg:28px;--liquid-radius-md:16px;--liquid-radius-pill:999px;
  --liquid-text-primary:#1d1d1f;
  --liquid-text-secondary:#6e6e73;
  --liquid-text-tertiary:#8b9098;

  /* —— 页面级补充 token —— */
  --ink:var(--liquid-text-primary);
  --muted:var(--liquid-text-secondary);
  --faint:var(--liquid-text-tertiary);
  --accent:#0071e3;
  --accent-soft:rgba(0,113,227,.12);
  --like:#ff3b30;
  --pos:#34c759;
  --neg:#ff3b30;
  --news:#ff3b30;
  --activity:#ff9500;
  --chip-bg:rgba(120,120,128,.10);
  --chip-line:rgba(15,23,42,.07);
  --hover:rgba(120,120,128,.08);
  --r-lg:var(--liquid-radius-lg);
  --r-md:var(--liquid-radius-md);
  --ease:cubic-bezier(.23,1,.32,1);
}
:root[data-theme="dark"]{
  --liquid-bg:rgba(28,28,36,.72);
  --liquid-bg-strong:rgba(40,40,52,.84);
  --liquid-bg-subtle:rgba(38,38,48,.58);
  --liquid-bg-nested:rgba(38,38,48,.42);
  --liquid-border:rgba(255,255,255,.12);
  --liquid-border-strong:rgba(255,255,255,.18);
  --liquid-border-hairline:rgba(255,255,255,.08);
  --liquid-highlight:inset 0 1px 0 rgba(255,255,255,.12);
  --liquid-highlight-subtle:inset 0 1px 0 rgba(255,255,255,.08);
  --liquid-shadow:0 20px 60px rgba(0,0,0,.4),0 1px 3px rgba(0,0,0,.3);
  --liquid-shadow-sm:0 8px 24px rgba(0,0,0,.3);
  --liquid-shadow-overlay:0 24px 80px rgba(0,0,0,.42);
  --liquid-text-primary:#f5f5f7;
  --liquid-text-secondary:#a1a1a6;
  --liquid-text-tertiary:#7c7c82;
  --accent:#2997ff;
  --accent-soft:rgba(41,151,255,.18);
  --like:#ff453a;
  --pos:#30d158;
  --neg:#ff453a;
  --news:#ff453a;
  --activity:#ff9f0a;
  --chip-bg:rgba(120,120,128,.18);
  --chip-line:rgba(255,255,255,.09);
  --hover:rgba(120,120,128,.16);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --liquid-bg:rgba(28,28,36,.72);
    --liquid-bg-strong:rgba(40,40,52,.84);
    --liquid-bg-subtle:rgba(38,38,48,.58);
    --liquid-bg-nested:rgba(38,38,48,.42);
    --liquid-border:rgba(255,255,255,.12);
    --liquid-border-strong:rgba(255,255,255,.18);
    --liquid-border-hairline:rgba(255,255,255,.08);
    --liquid-highlight:inset 0 1px 0 rgba(255,255,255,.12);
    --liquid-highlight-subtle:inset 0 1px 0 rgba(255,255,255,.08);
    --liquid-shadow:0 20px 60px rgba(0,0,0,.4),0 1px 3px rgba(0,0,0,.3);
    --liquid-shadow-sm:0 8px 24px rgba(0,0,0,.3);
    --liquid-shadow-overlay:0 24px 80px rgba(0,0,0,.42);
    --liquid-text-primary:#f5f5f7;
    --liquid-text-secondary:#a1a1a6;
    --liquid-text-tertiary:#7c7c82;
    --accent:#2997ff;
    --accent-soft:rgba(41,151,255,.18);
    --like:#ff453a;
    --pos:#30d158;
    --neg:#ff453a;
    --news:#ff453a;
    --activity:#ff9f0a;
    --chip-bg:rgba(120,120,128,.18);
    --chip-line:rgba(255,255,255,.09);
    --hover:rgba(120,120,128,.16);
  }
}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  :root{--liquid-bg:rgba(255,255,255,.96);--liquid-bg-strong:#fff;--liquid-bg-subtle:#f5f5f7}
  :root[data-theme="dark"]{--liquid-bg:#1e1e2a;--liquid-bg-strong:#252532}
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:15px;line-height:1.6;color:var(--ink);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
/* —— 背景光斑：给玻璃提供可折射的色彩 —— */
.bg{position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(900px 620px at 12% -8%,rgba(0,113,227,.16),transparent 62%),
    radial-gradient(820px 560px at 90% 8%,rgba(142,102,255,.13),transparent 60%),
    radial-gradient(760px 560px at 52% 110%,rgba(255,149,0,.10),transparent 62%),
    linear-gradient(180deg,#f7f8fa 0%,#eef0f4 100%);
}
:root[data-theme="dark"] .bg{
  background:
    radial-gradient(900px 620px at 12% -8%,rgba(41,151,255,.17),transparent 62%),
    radial-gradient(820px 560px at 90% 8%,rgba(142,102,255,.14),transparent 60%),
    radial-gradient(760px 560px at 52% 110%,rgba(255,159,10,.08),transparent 62%),
    linear-gradient(180deg,#0c0d13 0%,#12131b 100%);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .bg{
    background:
      radial-gradient(900px 620px at 12% -8%,rgba(41,151,255,.17),transparent 62%),
      radial-gradient(820px 560px at 90% 8%,rgba(142,102,255,.14),transparent 60%),
      radial-gradient(760px 560px at 52% 110%,rgba(255,159,10,.08),transparent 62%),
      linear-gradient(180deg,#0c0d13 0%,#12131b 100%);
  }
}

/* —— 玻璃基元 —— */
.glass{
  background:var(--liquid-bg);
  backdrop-filter:var(--liquid-filter);
  -webkit-backdrop-filter:var(--liquid-filter);
  border:1px solid var(--liquid-border);
  box-shadow:var(--liquid-shadow),var(--liquid-highlight);
  border-radius:var(--r-lg);
}
.glass-sm{
  background:var(--liquid-bg-subtle);
  backdrop-filter:var(--liquid-filter-sm);
  -webkit-backdrop-filter:var(--liquid-filter-sm);
  border:1px solid var(--liquid-border);
  box-shadow:var(--liquid-shadow-sm),var(--liquid-highlight-subtle);
  border-radius:var(--r-md);
}
.nested{
  background:var(--liquid-bg-nested);
  border:1px solid var(--liquid-border-hairline);
  border-radius:var(--r-md);
}

/* —— 顶栏 —— */
.topbar{
  position:fixed;top:12px;left:50%;transform:translateX(-50%);
  width:min(920px,calc(100% - 24px));height:56px;z-index:100;
  display:flex;align-items:center;gap:12px;padding:0 12px 0 18px;
  background:var(--liquid-bg-strong);
  backdrop-filter:var(--liquid-filter);
  -webkit-backdrop-filter:var(--liquid-filter);
  border:1px solid var(--liquid-border-strong);
  box-shadow:var(--liquid-shadow-sm),var(--liquid-highlight);
  border-radius:var(--liquid-radius-pill);
}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
.brand-dot{width:26px;height:26px;border-radius:9px;flex-shrink:0;
  background:linear-gradient(135deg,#0071e3,#5e5ce6);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 4px 10px rgba(0,113,227,.35);
  display:grid;place-items:center;color:#fff}
.brand-dot svg{width:14px;height:14px}
.brand-title{font-size:14.5px;font-weight:700;letter-spacing:.01em;white-space:nowrap}
.brand-sub{font-size:11px;color:var(--faint);margin-top:-2px}
.search-wrap{flex:1;min-width:0;display:flex;justify-content:flex-end}
.search{
  display:flex;align-items:center;gap:7px;width:min(260px,100%);
  height:36px;padding:0 12px;border-radius:var(--liquid-radius-pill);
  background:var(--chip-bg);border:1px solid var(--chip-line);
  color:var(--muted);transition:background .18s var(--ease),border-color .18s var(--ease);
}
.search:focus-within{background:var(--liquid-bg-nested);border-color:var(--accent)}
.search svg{width:14px;height:14px;flex-shrink:0;opacity:.7}
.search input{
  flex:1;min-width:0;border:0;outline:0;background:transparent;
  font:inherit;font-size:13px;color:var(--ink);
}
.search input::placeholder{color:var(--faint)}
.theme-btn{
  flex-shrink:0;height:36px;padding:0 13px;border-radius:var(--liquid-radius-pill);
  display:flex;align-items:center;gap:6px;cursor:pointer;
  border:1px solid var(--chip-line);background:var(--chip-bg);
  font:inherit;font-size:12.5px;font-weight:600;color:var(--muted);
  transition:transform .16s var(--ease),background .18s var(--ease);
}
.theme-btn:hover{background:var(--hover)}
.theme-btn:active{transform:scale(.95)}
.theme-btn svg{width:14px;height:14px}

/* —— 版心 —— */
main{max-width:860px;margin:0 auto;padding:104px 20px 64px}
.panel{margin-top:18px;padding:22px}

/* —— Hero —— */
.hero{display:flex;gap:16px;align-items:center}
.hero-icon{width:52px;height:52px;border-radius:16px;flex-shrink:0;
  background:linear-gradient(135deg,#0071e3,#5e5ce6);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 10px 24px rgba(0,113,227,.3);
  display:grid;place-items:center;color:#fff}
.hero-icon svg{width:24px;height:24px}
.hero h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-.01em}
.hero .sub{color:var(--muted);font-size:13.5px;margin-top:3px}
.hero .pill{margin-left:auto;flex-shrink:0;font-size:11.5px;font-weight:600;color:var(--muted);
  padding:6px 12px;border-radius:var(--liquid-radius-pill);
  background:var(--chip-bg);border:1px solid var(--chip-line);white-space:nowrap}

/* —— 统计 —— */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat{padding:15px 17px}
.stat b{display:block;font-size:25px;font-weight:800;letter-spacing:-.02em;line-height:1.2;
  font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:12.5px}

/* —— 标签页 —— */
.tabs-sticky{position:sticky;top:84px;z-index:90;padding:6px;margin-bottom:2px;
  border-radius:var(--liquid-radius-pill)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex-shrink:0;border:0;background:transparent;cursor:pointer;
  font:inherit;font-size:13.5px;font-weight:600;color:var(--muted);
  padding:9px 16px;border-radius:var(--liquid-radius-pill);
  display:flex;align-items:center;gap:7px;white-space:nowrap;
  transition:background .18s var(--ease),color .18s var(--ease);
}
.tab:hover{background:var(--hover)}
.tab.active{background:var(--accent);color:#fff;box-shadow:0 6px 16px rgba(0,113,227,.3)}
.tab .n{font-size:11px;font-weight:700;font-variant-numeric:tabular-nums;
  padding:1px 7px;border-radius:var(--liquid-radius-pill);
  background:var(--chip-bg);color:var(--muted)}
.tab.active .n{background:rgba(255,255,255,.24);color:#fff}
.view{display:none;margin-top:16px}
.view.active{display:block;animation:fadeUp .32s var(--ease)}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.result-line{margin:0 2px 10px;font-size:12.5px;color:var(--faint)}

/* —— 帖子卡（PostCard 同款骨架）—— */
.post{
  padding:18px 20px;margin-top:14px;cursor:default;
  transition:transform .2s var(--ease),box-shadow .2s var(--ease);
}
.post:hover{transform:translateY(-2px);box-shadow:var(--liquid-shadow-overlay),var(--liquid-highlight)}
.post-head{display:flex;align-items:center;gap:12px}
.avatar{
  width:42px;height:42px;border-radius:50%;flex-shrink:0;
  display:grid;place-items:center;color:#fff;font-size:16px;font-weight:700;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 2px 6px rgba(0,0,0,.12);
}
.avatar.sm{width:28px;height:28px;font-size:12px}
.author-info{display:flex;flex-direction:column;min-width:0}
.author-name{font-size:14px;font-weight:700;line-height:1.35}
.author-time{font-size:12px;color:var(--faint)}
.kind-badge{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:var(--liquid-radius-pill);margin-left:8px;vertical-align:1px}
.kind-badge.news{color:var(--news);background:rgba(255,59,48,.12)}
.kind-badge.activity{color:var(--activity);background:rgba(255,149,0,.14)}
.badge-self{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:var(--liquid-radius-pill);margin-left:6px;vertical-align:1px;
  color:var(--accent);background:var(--accent-soft)}
.post-title{margin:12px 0 0;font-size:17px;font-weight:700;letter-spacing:-.01em;line-height:1.45}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.tag{display:inline-flex;align-items:center;gap:4px;
  font-size:12px;font-weight:600;color:var(--muted);
  padding:3.5px 10px;border-radius:var(--liquid-radius-pill);
  background:var(--chip-bg);border:1px solid var(--chip-line)}
.tag svg{width:11px;height:11px}
.post-text{margin-top:10px;font-size:14.5px;line-height:1.75;color:var(--ink);white-space:pre-wrap;word-break:break-word}
.post-text.clamped{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.expand-btn{margin-top:6px;border:0;background:transparent;cursor:pointer;padding:2px 0;
  font:inherit;font-size:13px;font-weight:600;color:var(--accent);display:inline-flex;align-items:center;gap:3px}
.expand-btn svg{width:13px;height:13px;transition:transform .2s var(--ease)}
.expand-btn.open svg{transform:rotate(180deg)}

/* —— 图片九宫格 —— */
.thumb-grid{display:grid;gap:8px;margin-top:12px}
.thumb-grid.count-1{grid-template-columns:1fr}
.thumb-grid.count-2{grid-template-columns:1fr 1fr}
.thumb-grid.count-3{grid-template-columns:repeat(3,1fr)}
.thumb{position:relative;overflow:hidden;border-radius:13px;cursor:zoom-in;
  border:1px solid var(--liquid-border-hairline);background:var(--chip-bg);
  box-shadow:0 2px 8px rgba(15,23,42,.06);padding:0}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s var(--ease)}
.thumb:hover img{transform:scale(1.035)}
.thumb-grid.count-1 .thumb{aspect-ratio:16/9}
.thumb-grid.count-2 .thumb{aspect-ratio:4/3}
.thumb-grid.count-3 .thumb{aspect-ratio:1/1}

/* —— 互动行 —— */
.post-foot{display:flex;align-items:center;gap:24px;margin-top:14px;padding-top:13px;
  border-top:1px solid var(--liquid-border-hairline)}
.act{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.act svg{width:15px;height:15px}
.act.liked{color:var(--like)}
.act.archive{margin-left:auto;font-size:11.5px;font-weight:600;color:var(--faint);gap:5px}
.act.archive svg{width:11px;height:11px}

/* —— 评论（挂回帖子）—— */
.comments{margin-top:13px;padding-top:4px}
.comments-head{font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:8px}
.comment{display:flex;gap:9px;padding:7px 0}
.comment.reply{margin-left:37px;position:relative}
.comment.reply::before{content:"";position:absolute;left:-24px;top:14px;width:16px;height:1.5px;
  background:var(--chip-line)}
.comment-body{min-width:0;flex:1}
.comment-head{display:flex;align-items:baseline;gap:8px}
.comment-author{font-size:12.5px;font-weight:700}
.comment-time{font-size:11px;color:var(--faint)}
.comment-text{font-size:13.5px;line-height:1.6;margin-top:1px;word-break:break-word}

/* —— Cloud+ / 树洞 / 记录行 —— */
.entry{padding:18px 20px;margin-top:14px}
.entry-head{display:flex;align-items:center;gap:10px}
.entry-kind{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;
  padding:3px 10px;border-radius:var(--liquid-radius-pill)}
.entry-kind svg{width:11px;height:11px}
.entry-kind.cloud{color:var(--accent);background:var(--accent-soft)}
.entry-kind.hole{color:#bf5af2;background:rgba(191,90,242,.13)}
.cover{margin-top:13px;border-radius:13px;overflow:hidden;cursor:zoom-in;
  border:1px solid var(--liquid-border-hairline);box-shadow:0 2px 8px rgba(15,23,42,.06)}
.cover img{width:100%;aspect-ratio:16/8;object-fit:cover;display:block}
.record{display:flex;align-items:center;gap:13px;padding:13px 6px;
  border-bottom:1px solid var(--liquid-border-hairline)}
.record:last-child{border-bottom:0}
.record-icon{width:36px;height:36px;border-radius:11px;flex-shrink:0;
  display:grid;place-items:center}
.record-icon svg{width:16px;height:16px}
.ri-blue{color:var(--accent);background:var(--accent-soft)}
.ri-green{color:var(--pos);background:rgba(52,199,89,.13)}
.ri-orange{color:var(--activity);background:rgba(255,149,0,.13)}
.ri-purple{color:#bf5af2;background:rgba(191,90,242,.12)}
.ri-red{color:var(--neg);background:rgba(255,59,48,.11)}
.record-body{flex:1;min-width:0}
.record-title{font-size:13.5px;font-weight:650;line-height:1.4}
.record-sub{font-size:12px;color:var(--faint);margin-top:1px}
.record-side{flex-shrink:0;text-align:right}
.record-amount{font-size:14.5px;font-weight:750;font-variant-numeric:tabular-nums}
.record-time{font-size:11px;color:var(--faint);margin-top:1px}
.mood-chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:650;
  padding:3.5px 11px;border-radius:var(--liquid-radius-pill);
  background:rgba(191,90,242,.12);color:#bf5af2}
:root[data-theme="dark"] .mood-chip{color:#d899f5}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .mood-chip{color:#d899f5}
}

/* —— 文件清单 —— */
.files{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:4px}
.file{display:flex;align-items:center;gap:9px;padding:10px 13px;text-decoration:none;
  color:var(--ink);border-radius:12px;background:var(--chip-bg);
  border:1px solid var(--chip-line);transition:background .18s var(--ease)}
.file:hover{background:var(--hover)}
.file svg{width:14px;height:14px;color:var(--accent);flex-shrink:0}
.file-path{font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-size{margin-left:auto;font-size:11px;color:var(--faint);flex-shrink:0;font-variant-numeric:tabular-nums}

.foot-note{margin-top:26px;text-align:center;font-size:12px;color:var(--faint);line-height:1.8}

/* —— 灯箱 —— */
.lightbox{position:fixed;inset:0;z-index:200;display:none;cursor:zoom-out;
  background:rgba(10,12,18,.58);backdrop-filter:blur(22px) saturate(140%);-webkit-backdrop-filter:blur(22px) saturate(140%)}
.lightbox.open{display:grid;place-items:center;animation:lbIn .22s var(--ease)}

/* ============================================================

   ============================================================ */
const esc = (v) => String(v ?? '').replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtDate = (v) => v ? new Date(v).toLocaleString('zh-CN', { year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' }) : '';
const rows = (...names) => names.flatMap((n) => Array.isArray(DATA.files[n]) ? DATA.files[n] : []);
const imgSrc = (img) => img.demoSrc || img.path;
const avatarHtml = (name, sm) => {
  const n = String(name || '?');
  return '<div class="avatar' + (sm ? ' sm' : '') + '" style="background:linear-gradient(135deg,' +
    avColor(n) + ',' + avColor(n.split('').reverse().join('')) + ')">' + esc(n.charAt(0).toUpperCase()) + '</div>';
};

/* ============================================================
   渲染：论坛（PostCard 骨架）
   ============================================================ */
const commentsByPost = {};
rows('forum/comments.json').forEach((c) => {
  (commentsByPost[c.post_id] = commentsByPost[c.post_id] || []).push(c);
});

const commentHtml = (c, isReply) =>
  '<div class="comment' + (isReply ? ' reply' : '') + '">' +
    avatarHtml(c.author_username, true) +
    '<div class="comment-body">' +
      '<div class="comment-head"><span class="comment-author">@' + esc(c.author_username) + '</span>' +
      '<span class="comment-time">' + esc(fmtDate(c.created_at)) + '</span></div>' +
      '<div class="comment-text">' + esc(c.content) + '</div>' +
    '</div>' +
  '</div>';

const postHtml = (p, expandable) => {
  const comments = commentsByPost[p.id] || [];
  const roots = comments.filter((c) => !c.parent_id);
  const repliesByParent = {};
  comments.filter((c) => c.parent_id).forEach((r) => {
    (repliesByParent[r.parent_id] = repliesByParent[r.parent_id] || []).push(r);
  });
  const commentsHtml = roots.map((c) =>
    commentHtml(c, false) + (repliesByParent[c.id] || []).map((r) => commentHtml(r, true)).join('')
  ).join('');

  const tags =
    (p.tag_label ? '<span class="tag">' + esc(p.tag_label) + '</span>' : '') +
    (p.location_name ? '<span class="tag">' + icon('pin') + esc(p.location_name) + '</span>' : '');

  const grid = (p.images && p.images.length)
    ? '<div class="thumb-grid count-' + Math.min(p.images.length, 3) + '">' +
        p.images.map((img, i) =>
          '<button class="thumb" type="button" data-lb="' + esc(p.title) + '" data-src="' + imgSrc(img) + '">' +
          '<img src="' + imgSrc(img) + '" alt="图片 ' + (i + 1) + '" loading="lazy"></button>').join('') +
      '</div>'
    : '';

  const long = expandable && String(p.content || '').length > 160;
  const kindBadge = p.post_kind === 'news' ? '<span class="kind-badge news">新闻</span>'
    : p.post_kind === 'activity' ? '<span class="kind-badge activity">活动</span>' : '';

  return '<article class="glass-sm post" data-search="' + esc((p.title + ' ' + p.content + ' ' +
      comments.map((c) => c.content).join(' ')).toLowerCase()) + '">' +
    '<div class="post-head">' +
      avatarHtml(p.author_username) +
      '<div class="author-info">' +
        '<span class="author-name">@' + esc(p.author_username) + kindBadge +
          (p.liked_by_me ? '<span class="badge-self">你赞过</span>' : '') + '</span>' +
        '<span class="author-time">' + esc(fmtDate(p.created_at)) + '</span>' +
      '</div>' +
    '</div>' +
    (p.title ? '<h3 class="post-title">' + esc(p.title) + '</h3>' : '') +
    (tags ? '<div class="tags">' + tags + '</div>' : '') +
    grid +
    '<div class="post-text' + (long ? ' clamped' : '') + '">' + esc(p.content) + '</div>' +
    (long ? '<button class="expand-btn" type="button" data-expand>' + icon('chevron') + '<span>展开全文</span></button>' : '') +
    '<div class="post-foot">' +
      '<span class="act' + (p.liked_by_me ? ' liked' : '') + '">' + icon('heart', p.liked_by_me) + esc(p.like_count) + '</span>' +
      '<span class="act">' + icon('comment') + esc(p.comment_count ?? comments.length) + '</span>' +
      '<span class="act archive">' + icon('archive') + '存档自论坛</span>' +
    '</div>' +
    (commentsHtml ? '<div class="comments"><div class="comments-head">' + comments.length + ' 条评论</div>' + commentsHtml + '</div>' : '') +
  '</article>';
};

/* ============================================================
   交互：标签页 / 展开收起 / 搜索 / 灯箱 / 主题
   ============================================================ */
const switchTab = (id) => {
  document.querySelectorAll('.tab').forEach((t) => t.classList.toggle('active', t.dataset.tab === id));
  document.querySelectorAll('.view').forEach((v) => v.classList.toggle('active', v.id === 'view-' + id));
};
document.querySelectorAll('.tab').forEach((t) => t.addEventListener('click', () => switchTab(t.dataset.tab)));

/* 展开收起 */
document.addEventListener('click', (e) => {
  const btn = e.target.closest('[data-expand]');
  if (!btn) return;
  const text = btn.parentElement.querySelector('.post-text');
  const open = text.classList.toggle('clamped');
  btn.classList.toggle('open', !open);
  btn.querySelector('span').textContent = open ? '展开全文' : '收起';
});

/* 搜索：过滤论坛帖（含评论内容），自动跳到论坛页 */
const searchInput = document.getElementById('searchInput');
searchInput.addEventListener('input', () => {
  const q = searchInput.value.trim().toLowerCase();
  const posts = document.querySelectorAll('#view-forum .post');
  let hits = 0;
  posts.forEach((el) => {
    const match = !q || (el.dataset.search || '').includes(q);
    el.style.display = match ? '' : 'none';
    if (match) hits++;
  });
  if (q) switchTab('forum');
  let line = document.getElementById('searchLine');
  if (!line) {
    line = document.createElement('div');
    line.id = 'searchLine';
    line.className = 'result-line';
    document.getElementById('view-forum').prepend(line);
  }
  line.textContent = q ? '找到 ' + hits + ' 条与「' + searchInput.value.trim() + '」相关的记录' : '';
});

/* 灯箱（含上一张 / 下一张） */
const lbItems = [];
document.querySelectorAll('[data-lb]').forEach((el) => {
  lbItems.push({ src: el.dataset.src, cap: el.dataset.lb, el });
});
let lbIndex = -1;
const lightbox = document.getElementById('lightbox');
const showLb = (i) => {
  lbIndex = (i + lbItems.length) % lbItems.length;
  const item = lbItems[lbIndex];
  document.getElementById('lbImg').src = item.src;
  document.getElementById('lbCap').textContent = item.cap + (lbItems.length > 1 ? '　·　' + (lbIndex + 1) + '/' + lbItems.length : '');
};
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-lb]');
  if (t) { showLb(lbItems.findIndex((x) => x.el === t)); lightbox.classList.add('open'); }
});
lightbox.addEventListener('click', (e) => {
  if (e.target.closest('.lb-prev')) return showLb(lbIndex - 1);
  if (e.target.closest('.lb-next')) return showLb(lbIndex + 1);
  if (!e.target.closest('.lb-img') || e.target === lightbox) lightbox.classList.remove('open');
});
document.addEventListener('keydown', (e) => {
  if (!lightbox.classList.contains('open')) return;
  if (e.key === 'Escape') lightbox.classList.remove('open');
  if (e.key === 'ArrowLeft') showLb(lbIndex - 1);
  if (e.key === 'ArrowRight') showLb(lbIndex + 1);
});

/* 主题：自动 → 浅色 → 深色 循环 */
const THEME_KEY = 'boh-export-demo-theme';
const themeBtn = document.getElementById('themeBtn');
const applyTheme = (mode) => {
  const root = document.documentElement;
  if (mode === 'light') root.dataset.theme = 'light';
  else if (mode === 'dark') root.dataset.theme = 'dark';
  else delete root.dataset.theme;
  const meta = { auto:['auto','自动'], light:['sun','浅色'], dark:['moon','深色'] }[mode];
  document.getElementById('themeIcon').innerHTML = icon(meta[0]);
  document.getElementById('themeLabel').textContent = meta[1];
};
let themeMode = localStorage.getItem(THEME_KEY) || 'auto';
applyTheme(themeMode);
themeBtn.addEventListener('click', () => {
  themeMode = { auto:'light', light:'dark', dark:'auto' }[themeMode];
  localStorage.setItem(THEME_KEY, themeMode);
  applyTheme(themeMode);
});
</script>
