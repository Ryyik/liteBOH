<style>
  @property --spin {
    syntax: '<angle>';
    inherits: false;
    initial-value: 0deg;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 44px;
    background:
      radial-gradient(80% 60% at 50% 0%, #ffffff 0%, #eef1f6 55%, #e6eaf1 100%);
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', 'Helvetica Neue', sans-serif;
    color: #1d1d1f;
    overflow: hidden;
  }

  .page-title {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: .04em;
    color: #86868b;
  }

  /* ========== 灵动岛胶囊 ========== */

  .island-halo {
    position: relative;
    isolation: isolate;               /* 光晕层锁在本组内，避免漏到背景后面 */
    border-radius: 999px;
    padding: 2px;                     /* 彩虹描边厚度 */
    background: conic-gradient(
      from var(--spin),
      #ff5a5f, #ff9f43, #feca57,
      #1dd1a1, #48dbfb, #5f6cf6,
      #c56cf0, #ff5a5f
    );
    animation: spin 3.2s linear infinite;
  }

  /* 外发光：同款彩虹 conic，模糊后垫在胶囊底下 */
  .island-halo::after {
    content: '';
    position: absolute;
    inset: -10px;
    z-index: -1;
    border-radius: 999px;
    background: conic-gradient(
      from var(--spin),
      #ff5a5f, #ff9f43, #feca57,
      #1dd1a1, #48dbfb, #5f6cf6,
      #c56cf0, #ff5a5f
    );
    filter: blur(16px);
    opacity: .55;
    animation: spin 3.2s linear infinite, breathe 2.4s ease-in-out infinite;
  }

  @keyframes spin { to { --spin: 360deg; } }
  @keyframes breathe { 0%, 100% { opacity: .38; } 50% { opacity: .68; } }

  .island-body {
    border-radius: 999px;
    background:
      radial-gradient(130% 150% at 50% 0%, #1b1b21 0%, #050507 62%);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, .09),
      inset 0 0 18px rgba(0, 0, 0, .6);
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 20px 32px 20px 22px;
  }

  /* ========== 依次发光的圆点 spinner ========== */

  .spinner {
    position: relative;
    width: 54px;
    height: 54px;
    flex: none;
  }

  .spinner i {
    --r: 20px;                        /* 圆周半径 */
    position: absolute;
    top: 50%;
    left: 50%;
    width: 9px;
    height: 9px;
    margin: -4.5px 0 0 -4.5px;
    border-radius: 50%;
    background: var(--c);
    opacity: .16;
    transform: rotate(var(--a)) translateY(calc(-1 * var(--r))) scale(.72);
    animation: dot 1.8s ease-in-out infinite;
    animation-delay: calc(var(--i) * 1.8s / 8);
  }

  @keyframes dot {
    0%, 58%, 100% {
      opacity: .16;
      transform: rotate(var(--a)) translateY(calc(-1 * var(--r))) scale(.72);
      box-shadow: 0 0 0 transparent;
    }
    16% {
      opacity: 1;
      transform: rotate(var(--a)) translateY(calc(-1 * var(--r))) scale(1.24);
      box-shadow: 0 0 8px var(--c), 0 0 16px var(--c);
    }
  }

  /* ========== 文字 shimmer ========== */

  .island-text {
    font-size: 17px;
    font-weight: 600;
    letter-spacing: .02em;
    white-space: nowrap;
    background: linear-gradient(90deg, #7c7c82 0%, #ffffff 42%, #ffffff 58%, #7c7c82 100%);
    background-size: 240% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shimmer 2.6s linear infinite;
  }

  @keyframes shimmer {
    from { background-position: 130% 0; }
    to   { background-position: -130% 0; }
  }

  /* ========== 页脚规格说明 ========== */

  .specs {
    display: flex;
    gap: 22px;
    font-size: 12px;
    color: #a1a1a6;
  }
  .specs b { color: #6e6e73; font-weight: 600; }

  @media (prefers-reduced-motion: reduce) {
    .island-halo, .island-halo::after, .spinner i, .island-text { animation: none; }
    .spinner i { opacity: .5; }
  }
</style>
