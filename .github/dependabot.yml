version: 2

# 2026-10-04 新增。在此之前**没有依赖自动更新**：30+ 依赖全用 `^` 范围，
# 每次 `npm install` 都会打一串 audit 提示，但没有任何机制把它变成行动。
# 2026-10-04 实测 `npm audit` 有 15 个漏洞（含 dompurify 的 XSS、pptxgenjs 经 image-size 的 DoS），
# 跑 `npm audit fix` 后降到 6 个 —— 说明「定期让机器人提 PR」是有实际收益的。
#
# 设计取舍：
#   1. **minor/patch 分组**：把 development 与 production 的 minor/patch 各自合成一个 PR，
#      避免一次冒出 20 个 PR 把人淹没（Dependabot 最常见的失败模式）。
#   2. **major 一律不自动提**：本仓有 `check:bohai-params` / `check:project-structure` /
#      分层棘轮等一堆约束，大版本升级必须人工评估 + 跑全量 verify。
#   3. **限 5 个 PR**：够用，且不会占满 CI 并发（CI 的 concurrency 是 cancel-in-progress）。
#   4. github-actions 单独一条：workflow 里引用的 action 版本也该被追踪，
#      否则 `actions/checkout@v4` 会一直停在 v4 直到 GitHub 弃用。

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '03:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    groups:
      dev-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
      prod-patch:
        dependency-type: production
        update-types:
          - patch
    ignore:
      # 大版本升级一律人工：先看 CHANGELOG，再单独开分支跑全量 verify
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
    labels:
      - dependencies
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: 'chore(ci)'
