name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # 静态检查 job：与 build 并行执行，不阻塞构建关键路径
  checks:
    name: Lint & Type-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # 跳过测试（需要 Supabase 环境变量）
      # - name: Test
      #   run: npm run test

      - name: Type-check
        run: npm run type-check

  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      VITE_CLOUDINARY_DELIVERY_BASE_URL: https://cdn.blockofhome.cn
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # type-check 已移至并行 checks job，此处仅保留秒级检查
      - name: Build with Bundle Gate
        run: npm run build:ci

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [checks, build]
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # GitHub Pages 不会应用 public/_headers。Cloudflare 在代理层缓存入口文件时，
      # 发布后必须清除无 hash 资源，避免旧 HTML/SW 指向已被替换的 hash CSS。
      # 设置仓库 Secrets CLOUDFLARE_API_TOKEN（Zone.Cache Purge 权限）与
      # CLOUDFLARE_ZONE_ID 后自动启用；未设置时仅输出 notice，不阻断发布。
      - name: Purge Cloudflare app-shell cache
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ZONE_ID" ]; then
            echo "::notice::Cloudflare purge skipped: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ZONE_ID are required."
            exit 0
          fi

          if ! curl --fail-with-body --silent --show-error --request POST \
            "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/purge_cache" \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header "Content-Type: application/json" \
            --data '{"files":["https://www.blockofhome.cn/","https://www.blockofhome.cn/index.html","https://www.blockofhome.cn/sw.js","https://www.blockofhome.cn/version.json","https://www.blockofhome.cn/manifest.webmanifest","https://blockofhome.cn/","https://blockofhome.cn/index.html","https://blockofhome.cn/sw.js","https://blockofhome.cn/version.json","https://blockofhome.cn/manifest.webmanifest"]}'; then
            echo "::warning::Cloudflare cache purge failed; GitHub Pages deployment will continue."
          fi
