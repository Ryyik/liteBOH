name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  # 允许在 Actions 页面手动触发（Run workflow）。
  # 用途：补完 Cloudflare token 权限、或想单独验证响应头步骤时，无需推空提交。
  # 手动触发与 push 走完全相同的 job —— 本 workflow 不引用 github.event.head_commit，
  # commitHash 由 `git rev-parse --short HEAD` 取得，故手动触发下同样有值。
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 并发保护：GitHub Pages 同一时刻只允许一个「进行中的部署」。
# 缺这段时，两次 push 挨得太近（2026-09-25 实测相隔 27 秒）会让后一次运行的 deploy job 直接 400：
#   Deployment request failed for <sha> due to in progress deployment
# 那一步挂掉时 Lint / Build 都是绿的 —— 看起来像「构建失败」，其实是部署撞车。
# cancel-in-progress: false = 后来的排队等前一次跑完（不取消，避免把正在发布的产物撤掉）。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 静态检查 job：与 build 并行执行，不阻塞构建关键路径
  checks:
    name: Lint & Type-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # 跳过测试（需要 Supabase 环境变量）
      # - name: Test
      #   run: npm run test

      - name: Type-check
        run: npm run type-check

  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      VITE_CLOUDINARY_DELIVERY_BASE_URL: https://cdn.blockofhome.cn
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # type-check 已移至并行 checks job，此处仅保留秒级检查
      - name: Build with Bundle Gate
        run: npm run build:ci

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [checks, build]
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # GitHub Pages 不会应用 public/_headers。Cloudflare 在代理层缓存入口文件时，
      # 发布后必须清除无 hash 资源，避免旧 HTML/SW 指向已被替换的 hash CSS。
      # 设置仓库 Secrets CLOUDFLARE_API_TOKEN（Zone.Cache Purge 权限）与
      # CLOUDFLARE_ZONE_ID 后自动启用；未设置时仅输出 notice，不阻断发布。
      - name: Purge Cloudflare app-shell cache
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ZONE_ID" ]; then
            echo "::notice::Cloudflare purge skipped: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ZONE_ID are required."
            exit 0
          fi

          if ! curl --fail-with-body --silent --show-error --request POST \
            "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/purge_cache" \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header "Content-Type: application/json" \
            --data '{"files":["https://www.blockofhome.cn/","https://www.blockofhome.cn/index.html","https://www.blockofhome.cn/sw.js","https://www.blockofhome.cn/version.json","https://www.blockofhome.cn/manifest.webmanifest","https://blockofhome.cn/","https://blockofhome.cn/index.html","https://blockofhome.cn/sw.js","https://blockofhome.cn/version.json","https://blockofhome.cn/manifest.webmanifest"]}'; then
            echo "::warning::Cloudflare cache purge failed; GitHub Pages deployment will continue."
          fi

      # ⚠️ 本 job 与上面两个 job 不同：它只跑 actions/deploy-pages，
      #    工作目录里**没有源码**。所以必须先 checkout，否则 `node scripts/...`
      #    会以 MODULE_NOT_FOUND 退出 1，把整个 run 染红。
      #    （2026-09-21 踩过：Pages 部署本身已 success，却因这一步导致 run 显示 failure。）
      - name: Checkout（下面一步需要 scripts/ 下的源码）
        uses: actions/checkout@v5

      # GitHub Pages 无法下发安全响应头（public/_headers 线上不生效），
      # 只能由 Cloudflare 在边缘注入 Response Header Transform Rules。
      # 需要 token 具备 Zone -> Config（Transform Rules）-> Edit 权限；
      # 当前 CLOUDFLARE_API_TOKEN 若仅有 Cache Purge，本步骤会输出 warning 并跳过，不阻断发布。
      # 只管理带 [boh-security-headers] 标记的那一条规则，不会覆盖手工添加的其他规则。
      - name: Apply Cloudflare security headers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: node scripts/cloudflare-security-headers.mjs
