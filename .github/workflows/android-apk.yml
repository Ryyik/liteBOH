name: Build Android APK (TWA)

# 把线上 PWA 包成 Android 安装包（TWA：Trusted Web Activity）。
#
# 为什么走 CI 而不是本地：
# 1. 本地打一次包要装 JDK + Android SDK（约 1.5GB）与 Gradle 工具链，
#    GitHub 的 ubuntu runner 全部预装，开箱即用；
# 2. 签名密钥以 base64 存在 Secrets 里，不进仓库、不进本机磁盘；
# 3. 每次构建可复现，产物直接在 Actions 页面下载。
#
# 注意：TWA 是"壳"，运行时加载 https://www.blockofhome.cn，
# 所以 APK 里打包的图标/启动屏来自**线上**资源（由 deploy.yml 部署）。
# 这也是本工作流第一步要等资源就绪的原因。

on:
  push:
    branches: [main]
    paths:
      - 'android-twa/**'
      - 'public/icons/**'
      - 'public/.well-known/**'
      - 'vite.config.js'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

# 产物要发布到 Release 以拿到固定的免登录下载直链，需要写权限
permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build signed APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      # 前端先部署、APK 后构建：bubblewrap 会真的去下载 iconUrl，
      # 若图标还没上线会直接抛 "The icon URL is not valid"。
      - name: Wait for icons and manifest to be live
        run: |
          set -e
          urls=(
            "https://www.blockofhome.cn/manifest.webmanifest"
            "https://www.blockofhome.cn/icons/icon-512.png"
            "https://www.blockofhome.cn/icons/icon-maskable-512.png"
            "https://www.blockofhome.cn/icons/icon-monochrome-512.png"
          )
          for url in "${urls[@]}"; do
            ok=0
            for i in $(seq 1 30); do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$url" || echo 000)
              if [ "$code" = "200" ]; then
                echo "✓ $url"
                ok=1
                break
              fi
              echo "…等待 $url (HTTP $code, 第 $i 次)"
              sleep 10
            done
            if [ "$ok" != "1" ]; then
              echo "::error::$url 在 5 分钟内仍不可访问，无法打包"
              exit 1
            fi
          done

      - name: Restore signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.BOH_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::缺少 secret BOH_ANDROID_KEYSTORE_BASE64"
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > android-twa/android.keystore
          test -s android-twa/android.keystore

      - name: Install bubblewrap
        run: npm install -g @bubblewrap/cli@1.25.0

      # runner 预装的 Android SDK 有两个地方不符合 bubblewrap 的假设，必须补齐：
      # 1. AndroidSdkTools.validatePath 只认 SDK 根下的 `tools/` 或 `bin/` 目录，
      #    而现代 SDK 是 `cmdline-tools/latest/bin` 布局 —— 直接抛
      #    "The provided androidSdk isn't correct."；
      # 2. bubblewrap 把 BUILD_TOOLS_VERSION 硬编码成 36.1.0，镜像里没有就让
      #    sdkmanager 联网装，所以这里先把 `bin/sdkmanager` 接上并预装该版本。
      - name: Prepare Android SDK for bubblewrap
        run: |
          set -e
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "SDK: $SDK"
          echo "--- build-tools ---"; ls "$SDK/build-tools" || true
          echo "--- platforms ---"; ls "$SDK/platforms" || true

          CMDBIN=$(ls -d "$SDK"/cmdline-tools/*/bin 2>/dev/null | sort -V | tail -1)
          echo "cmdline-tools: $CMDBIN"
          sudo mkdir -p "$SDK/bin" "$SDK/tools/bin"
          sudo ln -sf "$CMDBIN/sdkmanager" "$SDK/bin/sdkmanager"
          sudo ln -sf "$CMDBIN/sdkmanager" "$SDK/tools/bin/sdkmanager"
          sudo chmod +x "$CMDBIN/sdkmanager"

          if [ ! -d "$SDK/build-tools/36.1.0" ]; then
            echo "预装 build-tools;36.1.0 …"
            yes | "$CMDBIN/sdkmanager" --sdk_root="$SDK" --licenses > /dev/null 2>&1 || true
            yes | "$CMDBIN/sdkmanager" --sdk_root="$SDK" "build-tools;36.1.0" "platform-tools" > /dev/null || true
          fi
          echo "--- 准备后 ---"; ls "$SDK/build-tools"

      # ⚠️ 必须直接写配置文件，不能用 `bubblewrap updateConfig`。
      # bubblewrap 在解析子命令**之前**（Cli.run 的第一步）就调用 loadOrCreateConfig：
      # ~/.bubblewrap/config.json 不存在时它会交互式问
      # "Do you want Bubblewrap to install the JDK (recommended)?"，
      # CI 里没人应答，进程被 SIGINT 掉（exit 130），updateConfig 根本来不及执行。
      # 预先写好两个路径，它会直接复用 runner 自带的 JDK/SDK，不再尝试下载 1GB+ 的副本。
      - name: Pre-seed bubblewrap config (non-interactive)
        run: |
          set -e
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          test -x "$JAVA_HOME/bin/java"
          test -d "$SDK/bin"
          mkdir -p ~/.bubblewrap
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}' "$JAVA_HOME" "$SDK" > ~/.bubblewrap/config.json
          cat ~/.bubblewrap/config.json
          echo
          echo "JDK: $JAVA_HOME"
          echo "SDK: $SDK"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-boh-twa
          restore-keys: gradle-${{ runner.os }}-

      # 由 twa-manifest.json 生成 Android 工程（每次全量重建，产物不入库）
      - name: Generate Android project
        working-directory: android-twa
        run: bubblewrap update --skipVersionUpgrade

      - name: Build signed APK
        working-directory: android-twa
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.BOH_ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.BOH_ANDROID_KEY_PASSWORD }}
          # PWA 质量分不达标时不要拦构建（我们的 manifest 已达标，但 validator 会联网打分）
        run: bubblewrap build --skipPwaValidation

      - name: Verify signature fingerprint
        working-directory: android-twa
        env:
          EXPECTED: 'F3:A7:AC:5E:C2:C6:70:01:79:35:7D:00:A2:B0:93:E1:F6:E4:3E:8C:E6:21:4E:D0:09:35:58:80:F3:21:3B:52'
        run: |
          APK=$(ls app-release-signed.apk 2>/dev/null || ls *.apk | head -1)
          echo "产物：$APK"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          ACTUAL=$("$APKSIGNER" verify --print-certs "$APK" | grep -i 'SHA-256 digest' | head -1 | awk '{print $NF}' | tr 'a-z' 'A-Z')
          ACTUAL=$(echo "$ACTUAL" | sed 's/\(..\)/\1:/g; s/:$//')
          echo "APK 签名指纹：$ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::签名指纹与 assetlinks.json 不一致，TWA 会退回带地址栏的浏览器外壳"
            exit 1
          fi
          ls -lh *.apk *.aab 2>/dev/null || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: boh-android-apk-${{ github.run_number }}
          path: |
            android-twa/*.apk
            android-twa/*.aab
          retention-days: 30
          if-no-files-found: error

      # 发布到固定 tag 的 Release —— 落地页 /app 引用的就是这个直链。
      #
      # 用 tag 直链而非 releases/latest/download：latest 是全局判定，
      # 将来发别的 Release 会把它抢走，tag 直链不会。
      # 每次都覆盖同一个 tag 的同一个文件名，于是链接永久有效、永远指向最新构建，
      # 前端不需要跟着改（唯一真相源见 src/views/BOHApp/app-release.js）。
      - name: Publish to Release (fixed download URL)
        working-directory: android-twa
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          APK=$(ls app-release-signed.apk 2>/dev/null || ls *.apk | head -1)
          # 文件名固定为 boh.apk：用户下载到的名字稳定，覆盖安装也不会变成两个应用
          cp "$APK" boh.apk
          ls -lh boh.apk

          TAG=android-latest
          NOTES=$(printf 'BOH Android 客户端（TWA 外壳）。\n\n构建：%s #%s\n提交：%s\n' \
            "$GITHUB_SHA" "$GITHUB_RUN_NUMBER" "$GITHUB_SHA")

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" boh.apk --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" boh.apk \
              --repo "$GITHUB_REPOSITORY" \
              --title "BOH Android 客户端（最新构建）" \
              --notes "$NOTES" \
              --latest
          fi

          echo "下载直链：https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/boh.apk"
