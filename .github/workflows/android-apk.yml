name: Build Android APK (TWA)

# 把线上 PWA 包成 Android 安装包（TWA：Trusted Web Activity）。
#
# 为什么走 CI 而不是本地：
# 1. 本地打一次包要装 JDK + Android SDK（约 1.5GB）与 Gradle 工具链，
#    GitHub 的 ubuntu runner 全部预装，开箱即用；
# 2. 签名密钥以 base64 存在 Secrets 里，不进仓库、不进本机磁盘；
# 3. 每次构建可复现，产物直接在 Actions 页面下载。
#
# 注意：TWA 是"壳"，运行时加载 https://www.blockofhome.cn，
# 所以 APK 里打包的图标/启动屏来自**线上**资源（由 deploy.yml 部署）。
# 这也是本工作流第一步要等资源就绪的原因。

on:
  push:
    branches: [main]
    paths:
      - 'android-twa/**'
      - 'public/icons/**'
      - 'public/.well-known/**'
      - 'vite.config.js'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build signed APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      # 前端先部署、APK 后构建：bubblewrap 会真的去下载 iconUrl，
      # 若图标还没上线会直接抛 "The icon URL is not valid"。
      - name: Wait for icons and manifest to be live
        run: |
          set -e
          urls=(
            "https://www.blockofhome.cn/manifest.webmanifest"
            "https://www.blockofhome.cn/icons/icon-512.png"
            "https://www.blockofhome.cn/icons/icon-maskable-512.png"
            "https://www.blockofhome.cn/icons/icon-monochrome-512.png"
          )
          for url in "${urls[@]}"; do
            ok=0
            for i in $(seq 1 30); do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$url" || echo 000)
              if [ "$code" = "200" ]; then
                echo "✓ $url"
                ok=1
                break
              fi
              echo "…等待 $url (HTTP $code, 第 $i 次)"
              sleep 10
            done
            if [ "$ok" != "1" ]; then
              echo "::error::$url 在 5 分钟内仍不可访问，无法打包"
              exit 1
            fi
          done

      - name: Restore signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.BOH_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::缺少 secret BOH_ANDROID_KEYSTORE_BASE64"
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > android-twa/android.keystore
          test -s android-twa/android.keystore

      - name: Install bubblewrap
        run: npm install -g @bubblewrap/cli@1.25.0

      # runner 已预装 Android SDK，把它指给 bubblewrap，
      # 否则它会尝试自己再下一套 1GB+ 的 SDK。
      - name: Point bubblewrap at the preinstalled SDK
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_HOME=${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          bubblewrap updateConfig \
            --jdkPath="$JAVA_HOME" \
            --androidSdkPath="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-boh-twa
          restore-keys: gradle-${{ runner.os }}-

      # 由 twa-manifest.json 生成 Android 工程（每次全量重建，产物不入库）
      - name: Generate Android project
        working-directory: android-twa
        run: bubblewrap update --skipVersionUpgrade

      - name: Build signed APK
        working-directory: android-twa
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.BOH_ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.BOH_ANDROID_KEY_PASSWORD }}
          # PWA 质量分不达标时不要拦构建（我们的 manifest 已达标，但 validator 会联网打分）
        run: bubblewrap build --skipPwaValidation

      - name: Verify signature fingerprint
        working-directory: android-twa
        env:
          EXPECTED: 'F3:A7:AC:5E:C2:C6:70:01:79:35:7D:00:A2:B0:93:E1:F6:E4:3E:8C:E6:21:4E:D0:09:35:58:80:F3:21:3B:52'
        run: |
          APK=$(ls app-release-signed.apk 2>/dev/null || ls *.apk | head -1)
          echo "产物：$APK"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          ACTUAL=$("$APKSIGNER" verify --print-certs "$APK" | grep -i 'SHA-256 digest' | head -1 | awk '{print $NF}' | tr 'a-z' 'A-Z')
          ACTUAL=$(echo "$ACTUAL" | sed 's/\(..\)/\1:/g; s/:$//')
          echo "APK 签名指纹：$ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::签名指纹与 assetlinks.json 不一致，TWA 会退回带地址栏的浏览器外壳"
            exit 1
          fi
          ls -lh *.apk *.aab 2>/dev/null || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: boh-android-apk-${{ github.run_number }}
          path: |
            android-twa/*.apk
            android-twa/*.aab
          retention-days: 30
          if-no-files-found: error
