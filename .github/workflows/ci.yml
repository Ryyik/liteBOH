name: CI Quality Gate

on:
  pull_request:
  push:
    branches:
      - main

# 同一 ref 上的连续推送不必各自跑满 —— 后一次直接取代前一次。
# 与 deploy.yml 反着来是对的：deploy 用 cancel-in-progress:false（部署跑到一半不能撤，
# 否则正在发布的产物会被拉下来），而 CI 只做验证，旧版本的半成品没有任何价值。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    # 审计步骤要调 `gh api .../compare` 判定变更域 ⇒ 显式要 contents: read，
    # 不依赖仓库级的默认 token 权限（默认收紧过一次，踩了就是静默降级成告警档）。
    permissions:
      contents: read
    env:
      # VITE_* 是前端构建期常量，跑不掉：缺了的话 build / type-check 拿到空串，
      # check:first-paint 与依赖扫描的结果会失真。url 和 anon key 本身就是可公开的
      # 前端配置，走 secrets 只是为了两个 workflow 共用一份、不重复粘贴。
      VITE_CLOUDINARY_DELIVERY_BASE_URL: https://cdn.blockofhome.cn
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # 22，不是 20：vite 7 与 typescript 6 要求 node ^20.19 || >=22.12，
          # 锁在 20 上会在 type-check / build 阶段踩 EBADENGINE。
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit (ratchet)
        # 2026-10-04 新增：依赖漏洞**棘轮**（scripts/check-npm-audit.mjs）。
        # 为什么不用 `npm audit --audit-level=high` 直接卡阈值：卡阈值会**永远红** ——
        # 红久了就没人看了，比没有门禁更糟。所以沿用本仓棘轮套路：存量锁死、只许降不许升。
        # 基线在 scripts/npm-audit-baseline.json；降完依赖跑 `npm run security:audit:update` 下调。
        #
        # 2026-10-27 起改为**按变更域分档**（判定在 scripts/lib/audit-scope.mjs，有单测）：
        #   · 本次推送改了 package.json / package-lock.json ⇒ 严格档，谁动依赖谁清账；
        #   · 没改 ⇒ 告警档，只打 annotation + step summary，**不阻断**。
        # 起因：这条门禁的判据是 npm 公告库，不是本仓代码 —— 同一份 lock 昨天绿、今天红。
        # 10-27 三条新公告（fast-uri / esbuild / serialize-javascript）把一次纯 CSS 推送卡红，
        # main 一直红到有人手动升包。这类失败与作者改动无关，一律阻断只会教人无视门禁。
        # 新公告的跟踪由 .github/workflows/audit-scheduled.yml 兜底（每日严格档 + 自动开 issue）。
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PR 事件没有 event.before，用基分支 sha；push 事件反过来。缺值时脚本降为告警档。
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm run security:audit:ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        # pool 与并发上限由 vitest.config.js 统一管（pool: forks / maxForks: 2），
        # 这里不再重复传参 —— 传了就等于有第二份真源。
        run: npm run test

      - name: Build with all gates
        # build:ci = 九道源码门禁 + type-check + vite build + 产物门禁(shell-precache) + 包体闸门。
        # 门禁清单以 package.json 的 build:ci 为准，不要在这里另抄一份 ——
        # 抄了就会出现「本地摆烂一遍、CI 摆烂另一遍」。
        run: npm run build:ci

  # 门禁自检：证明每道门禁**真的会红**。
  #
  # 为什么单独成 job，而不是并进 quality：
  #   它会**临时改写工作区文件**（注入违规样本 → 跑门禁 → 撤销）。放在干净检出上跑最安全 ——
  #   万一中途崩了也只污染这一个 job，不会让质量门禁的结论变得可疑。
  #   同理它也**不该**进 package.json 的 verify/build:ci 主链（那是给本地开发用的）。
  #
  # 背景：本仓库出过两次「检查在跑、但永远绿」——
  #   · check-project-structure 只过滤 .js，而路由全是 .ts → 53 条一条没查，却输出 clean；
  #   · check:dark-tokens 跑在观察档（总量上升只打 ⚠️，exit 0）→ 永不阻断任何构建。
  #   两者都表现为「CI 全绿」。假绿是静默的，靠人盯是盯不住的，只能靠机器周期性自证。
  #
  # 不需要 VITE_* 环境变量：自检覆盖的七道门禁都是纯源码扫描，不碰 Supabase。
  gate-self-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Gate self-test
        # 样本在 scripts/lib/gate-fixtures.mjs。某条门禁若「注入违规后仍然 exit 0」，
        # 本步会失败并点名它是假绿嫌疑。
        run: npm run check:gates-self-test
