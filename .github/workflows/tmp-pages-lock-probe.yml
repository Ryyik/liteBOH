# 一次性诊断（2026-10-08）：验证 concurrency group `pages` 是否被僵尸锁占住。
# 结论得出后删除本文件。
name: Pages Lock Probe

on:
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Echo
        run: echo 'pages group is free'
