<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BOHAI 液玻接入原型 · 输入框 + 模型/工具浮层</title>
<style>
/* ── BOHAI 令牌子集（值取自 src/views/BOHAI/BOHAI/styles/tokens.css） ── */
:root {
  --boh-bg-page: #ffffff; --boh-bg-card: #f5f5f5; --boh-composer-bg: #ffffff; --boh-bubble-bg: #ffffff;
  --boh-bg-hover: rgba(0, 0, 0, .045); --boh-bg-active: rgba(0, 0, 0, .08);
  --boh-border: #e5e5e5; --boh-border-strong: #d4d4d4;
  --boh-text-1: #0a0a0a; --boh-text-2: #737373; --boh-text-3: #a3a3a3;
  --boh-accent: #0a0a0a; --boh-accent-contrast: #ffffff;
  --boh-radius-md: 10px; --boh-radius-lg: 12px; --boh-radius-xl: 14px; --boh-radius-shell: 20px;
  --boh-shadow-lg: 0 14px 40px rgba(0, 0, 0, .16);
  --boh-dur-fast: 150ms; --boh-dur-med: 200ms; --boh-ease: cubic-bezier(.4, 0, .2, 1);
  --boh-content-w: 880px;
  --boh-font-ui: ui-sans-serif, -apple-system, system-ui, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
}
[data-boh-theme='dark'] {
  --boh-bg-page: #171717; --boh-bg-card: #262626; --boh-composer-bg: #262626; --boh-bubble-bg: #262626;
  --boh-bg-hover: rgba(255, 255, 255, .06); --boh-bg-active: rgba(255, 255, 255, .1);
  --boh-border: #303030; --boh-border-strong: #404040;
  --boh-text-1: #f5f5f5; --boh-text-2: #a3a3a3; --boh-text-3: #737373;
  --boh-accent: #f5f5f5; --boh-accent-contrast: #0a0a0a;
  --boh-shadow-lg: 0 14px 40px rgba(0, 0, 0, .6);
}
* { box-sizing: border-box; }
body { margin: 0; font-family: var(--boh-font-ui); font-size: 14px; -webkit-font-smoothing: antialiased; }
button { font: inherit; cursor: pointer; background: none; border: 0; padding: 0; color: inherit; }

.bohai-page {
  height: 100vh; display: flex; flex-direction: column;
  background: var(--boh-bg-page); color: var(--boh-text-1); overflow: hidden;
}
.ctrl {
  display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
  padding: 10px 16px; border-bottom: 1px solid var(--boh-border); background: var(--boh-bg-page);
}
.ctrl label { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--boh-text-2); }
.ctrl input[type="range"] { width: 150px; }
.ctrl b { min-width: 42px; color: var(--boh-text-1); font-variant-numeric: tabular-nums; }
.ctrl-btn { border: 1px solid var(--boh-border); border-radius: 8px; padding: 5px 12px; font-size: 12.5px; color: var(--boh-text-1); }
.ctrl-note { font-size: 11.5px; color: var(--boh-text-3); margin-left: auto; }

.boh-main { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; }
.stream { flex: 1; min-height: 0; overflow-y: auto; padding: 26px 40px 64px; }
.msg { display: flex; margin-bottom: 18px; }
.msg.user { justify-content: flex-end; }
.msg .text { max-width: var(--boh-content-w); line-height: 1.72; color: var(--boh-text-1); }
.msg .bubble {
  max-width: 520px; padding: 8px 13px; border: 1px solid var(--boh-border);
  border-radius: var(--boh-radius-xl); background: var(--boh-bubble-bg); line-height: 1.6;
}
.boh-composer-wrap { position: relative; padding: 0 40px 18px; margin-top: -186px; pointer-events: none; }
.composer-anchor { position: relative; max-width: var(--boh-content-w); margin: 0 auto 0 0; pointer-events: auto; }

/* ── 覆盖层玻璃（核心结构） ──
   ⚠️ 采样根规则（实测）：玻璃祖先链上任何 z-index 堆叠上下文都会成为「背板采样根」——
      玻璃只能采样该根**内部**的内容；本项目里根内部没有背景内容 ⇒ 模糊**完全消失**（Δ=0）。
      ⇒ .glass-under / .menu-anchor / .boh-composer / .boh-composer-wrap 一律**不写 z-index**，
        靠 DOM 顺序保证层序（玻璃 → 内容 → 浮层）。 */
.glass-under {
  position: absolute; inset: 0; pointer-events: none;
  border-radius: var(--glass-radius); overflow: hidden;
}
.glass-under .glass, .glass-under .glass > div { width: 100%; height: 100%; }
.glass-tint { width: 100%; height: 100%; background: var(--glass-tint); border-radius: var(--glass-radius); }

/* ── 输入框（几何照抄 boh-composer.css） ── */
.boh-composer {
  position: relative;
  padding: 11px 13px 9px;
  border: 1px solid var(--boh-border);
  border-radius: var(--boh-radius-shell);
  background: transparent;
}
.boh-composer-input {
  display: block; width: 100%; min-height: 24px; max-height: min(40vh, 340px);
  padding: 2px 4px 6px; border: 0; outline: 0; background: none; color: var(--boh-text-1);
  font-family: inherit; font-size: 14.5px; line-height: 1.55; resize: none;
}
.boh-composer-input::placeholder { color: var(--boh-text-3); }
.boh-cp-toolbar { display: flex; align-items: center; gap: 6px; margin-top: 2px; }
.boh-cp-icon {
  display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px;
  border-radius: var(--boh-radius-md); color: var(--boh-text-3);
}
.boh-cp-icon:hover { background: var(--boh-bg-hover); color: var(--boh-text-1); }
.boh-cp-spacer { flex: 1; }
.boh-send {
  display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px;
  border-radius: 999px; background: var(--boh-accent); color: var(--boh-accent-contrast);
}

/* ── 胶囊（照抄） ── */
.boh-mode-wrap, .boh-tools-wrap { position: relative; display: flex; flex: none; min-width: 0; }
.boh-mode-pill, .boh-tools-pill {
  display: inline-flex; align-items: center; gap: 5px; max-width: 100%; height: 30px;
  padding: 0 10px 0 12px; border: 1px solid var(--boh-border); border-radius: 999px;
  color: var(--boh-text-2); font-size: 12.5px;
  transition: background var(--boh-dur-fast) var(--boh-ease), color var(--boh-dur-fast) var(--boh-ease);
}
.boh-tools-pill { gap: 3px; padding: 0 8px 0 10px; }
.boh-mode-pill:hover, .boh-tools-pill:hover, .boh-mode-pill.is-open, .boh-tools-pill.is-open { background: var(--boh-bg-hover); color: var(--boh-text-1); }
.boh-mode-pill-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.boh-mode-pill svg, .boh-tools-pill svg { flex: none; color: var(--boh-text-3); }

/* ── 浮层（锚点承载定位，菜单回归流内；原绝对定位在 .menu-anchor 上）
   ⚠️ 同样零 z-index（采样根规则）：菜单靠 DOM 顺序压在输入框内容之上。 ── */
.menu-anchor { position: absolute; bottom: calc(100% + 8px); left: 0; width: 252px; }
.boh-mode-menu, .boh-tools-menu {
  position: relative; padding: 6px; border: 1px solid var(--boh-border);
  border-radius: var(--boh-radius-lg); background: transparent;
  box-shadow: var(--boh-shadow-lg); overflow: visible;
}
.boh-mm-body { max-height: calc(100vh - 120px); overflow-y: auto; }
.boh-mm-item {
  display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%;
  padding: 8px 10px; border-radius: var(--boh-radius-md); color: var(--boh-text-1);
  font-size: 13px; font-weight: 500; text-align: left;
  transition: background var(--boh-dur-fast) var(--boh-ease);
}
.boh-mm-item:hover { background: var(--boh-bg-hover); }
.boh-mm-item.is-on { background: var(--boh-bg-active); }
.boh-mm-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.boh-mm-rate { flex: none; font-size: 11px; color: var(--boh-text-3); }
.boh-mm-custom {
  display: flex; align-items: center; gap: 7px; width: 100%; margin-top: 4px; padding: 8px 10px 6px;
  border-top: 1px solid var(--boh-border); color: var(--boh-text-2); font-size: 12.5px; text-align: left;
}
.boh-mm-custom:hover { color: var(--boh-text-1); }
.boh-mm-tool {
  display: flex; align-items: flex-start; gap: 10px; width: 100%; padding: 9px 10px;
  border-radius: var(--boh-radius-md); text-align: left; color: var(--boh-text-1);
  transition: background var(--boh-dur-fast) var(--boh-ease);
}
.boh-mm-tool:hover { background: var(--boh-bg-hover); }
.boh-mm-tool.is-on { background: var(--boh-bg-active); }
.boh-mm-tool svg { flex: none; margin-top: 1px; color: var(--boh-text-2); }
.boh-mm-tool strong { display: block; font-size: 13px; font-weight: 500; }
.boh-mm-tool small { display: block; margin-top: 1px; font-size: 11.5px; color: var(--boh-text-3); }

/* ── 降级（无 backdrop-filter ⇒ 实底） ── */
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  .glass-under { display: none; }
  .boh-composer { background: var(--boh-composer-bg); }
  .boh-mode-menu, .boh-tools-menu { background: var(--boh-bg-page); }
}
</style>
