<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>方块之家 · 2026 年终</title>
<meta name="description" content="方块之家 2026 年终片 · 纯前端绘制的伪视频。片中所有数字与标题均来自站内真实数据。">
<style>
  /* ============================================================
     方块之家 · 2026 年终片（白底黑字）
     ------------------------------------------------------------
     结构：一个全局时间轴 t（秒）驱动逐帧渲染；硬切，不做转场。
     骨架：365 格年历。每格一天，有帖子的日子变黑。
     所有数字/标题来自站内真实数据（见脚本 DATA 段）。
     空格 暂停 / ← → 跳幕 / 拖进度条 / R 重播
     ============================================================ */

  :root{
    --paper:#ffffff;
    --ink:#0a0a0a;
    --ink-2:#6e6e73;
    --ink-3:#a8a8ad;
    --hair:#e6e6ea;
    --shell:#f0f0f2;
    --red:#c8262c;
  }

  *{box-sizing:border-box}

  html,body{
    margin:0;height:100%;
    background:var(--shell);
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro SC","SF Pro Display","PingFang SC","Hiragino Sans GB","Helvetica Neue",system-ui,sans-serif;
    color:var(--ink);
  }

  #film{
    position:fixed;inset:0;
    display:flex;align-items:center;justify-content:center;
    background:var(--shell);
    padding:0 0 78px;
  }

  #stage{
    position:relative;
    aspect-ratio:16/9;
    width:min(100vw, calc((100vh - 92px) * 16 / 9));
    background:var(--paper);
    overflow:hidden;
    container-type:inline-size;
    isolation:isolate;
  }

  #cv{position:absolute;inset:0;width:100%;height:100%;display:block}

  #grain{
    position:absolute;inset:-60px;
    pointer-events:none;
    opacity:.028;
    will-change:transform;
  }

  #type{position:absolute;inset:0;pointer-events:none}

  .sc{
    position:absolute;inset:0;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    opacity:0;visibility:hidden;
    color:var(--ink);
  }
  .sc.on{opacity:1;visibility:visible}

  /* mask 揭示：外层裁切，内层位移 —— 「字从地里长出来」 */
  .mask{overflow:hidden;display:block}
  .mask > i{display:inline-block;font-style:normal;will-change:transform}

  /* 行内逐字遮蔽：用于需要在句中做逐字升起的段落 */
  .lmask{
    display:inline-block;overflow:hidden;vertical-align:bottom;
    padding-bottom:.14em;margin-bottom:-.14em;
  }
  .lmask > i{display:inline-block;font-style:normal;will-change:transform}

  /* 出处标注：每幕右下角，标明这段内容来自哪个页面 */
  .src{
    position:absolute;right:4.4cqw;bottom:4.2cqw;
    font-family:ui-monospace,"SF Mono",Menlo,monospace;
    font-size:max(9px,.82cqw);letter-spacing:.12em;
    color:var(--ink-3);
  }

  /* ---------- 播放外壳 ---------- */
  #chrome{
    position:fixed;left:0;right:0;bottom:0;
    height:78px;padding:0 30px 18px;
    display:flex;align-items:flex-end;gap:18px;
    font-size:11.5px;color:#9a9aa0;letter-spacing:.06em;
    transition:opacity .5s ease;
    z-index:20;
  }
  #chrome.idle{opacity:0}
  @media (hover:none){#chrome.idle{opacity:.55}}

  .cbtn{
    width:26px;height:26px;flex:0 0 26px;
    border:0;padding:0;background:none;
    color:#8e8e94;cursor:pointer;
    display:grid;place-items:center;
    transition:color .2s;
  }
  .cbtn:hover{color:#111}
  .cbtn svg{width:13px;height:13px;display:block}

  #track{position:relative;flex:1;height:26px;display:flex;align-items:center;cursor:pointer}
  #track .bar{position:relative;width:100%;height:2px;background:#dcdce1;border-radius:2px;overflow:hidden;transition:height .18s ease}
  #track:hover .bar{height:4px}
  #track .fill{position:absolute;left:0;top:0;bottom:0;width:0%;background:#111;border-radius:2px}
  #track .marks{position:absolute;inset:0;pointer-events:none}
  #track .marks i{position:absolute;top:0;bottom:0;width:1px;background:#fff;opacity:.9}

  #tc{
    font-family:ui-monospace,"SF Mono",Menlo,monospace;
    font-variant-numeric:tabular-nums;font-size:11.5px;
    letter-spacing:.06em;min-width:72px;text-align:right;color:#9a9aa0;
  }
  #tc b{color:#3a3a3e;font-weight:400}

  #mute.off #wave{display:none}
  #mute:not(.off) #slash{display:none}

  #chap{
    position:fixed;left:30px;bottom:54px;
    font-size:11px;letter-spacing:.24em;color:#c2c2c8;
    z-index:20;transition:opacity .6s ease;
  }
  #chap.idle{opacity:0}

  #again{
    position:absolute;left:50%;top:50%;
    transform:translate(-50%,-50%) scale(.96);
    padding:13px 26px;border-radius:999px;
    border:1px solid #d8d8dd;background:rgba(255,255,255,.82);
    -webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);
    color:#111;font-size:13px;letter-spacing:.08em;
    cursor:pointer;opacity:0;pointer-events:none;
    transition:opacity .5s ease,transform .5s cubic-bezier(.16,1,.3,1);
    z-index:30;font-family:inherit;
  }
  #again.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
  #again:hover{background:#fff;border-color:#111}

  #rotate{
    position:fixed;left:0;right:0;top:14px;text-align:center;
    font-size:11px;letter-spacing:.18em;color:#b0b0b6;
    z-index:40;opacity:0;transition:opacity .6s ease;pointer-events:none;
  }
  #rotate.on{opacity:1}

  @media (prefers-reduced-motion:reduce){ #grain{display:none} }

  /* ============================================================
     1 · 年历：365 格
     ============================================================ */
  #yr-head{
    position:absolute;left:6cqw;top:6.4cqw;
    display:flex;flex-direction:column;gap:.9cqw;
  }
  #yr-year{
    font-size:clamp(18px,2.1cqw,34px);font-weight:500;letter-spacing:.02em;
  }
  #yr-cap{
    font-size:max(10px,.95cqw);letter-spacing:.2em;color:var(--ink-3);
    font-family:ui-monospace,"SF Mono",Menlo,monospace;
  }
  #yr-foot{
    position:absolute;left:6cqw;right:6cqw;bottom:6cqw;
    display:flex;align-items:flex-end;gap:1.5cqw;
  }
  #yr-count{
    font-size:clamp(30px,6.4cqw,104px);font-weight:500;line-height:.86;
    letter-spacing:-.045em;font-variant-numeric:tabular-nums;
  }
  #yr-unit{
    font-size:clamp(11px,1.3cqw,21px);color:var(--ink-2);
    padding-bottom:.8cqw;letter-spacing:.04em;
  }
  #yr-note{
    margin-left:auto;text-align:right;
    font-size:max(10px,1.02cqw);line-height:1.7;color:var(--ink-2);
    letter-spacing:.03em;padding-bottom:.4cqw;
  }

  /* ============================================================
     2 · 论坛：用户的原话从屏幕外大字号飞入，缩小落定并铺满画面
     ============================================================ */
  #forum-stack{position:absolute;inset:0;overflow:hidden}

  .fl{
    position:absolute;inset:0;
    display:flex;flex-direction:column;justify-content:center;
    /* 左右留 5%：字要"铺满"，但不能真的顶到边缘（顶死会显得局促，
       而且手机圆角会把字切掉）。 */
    padding:0 5%;
    opacity:0;visibility:hidden;
  }
  .fl.on{opacity:1;visibility:visible}
  /* 真正被 transform 的是这一层：设 origin 为几何中心，
     缩放时字是「向中心收」，不是「向右下角收」。 */
  .fl-in{
    transform-origin:50% 50%;
    will-change:transform,opacity;
    backface-visibility:hidden;
  }
  .fl .d{
    display:block;
    font-family:ui-monospace,"SF Mono",Menlo,monospace;
    font-size:max(10px,1.02cqw);letter-spacing:.18em;color:var(--ink-3);
    margin-bottom:1.2cqw;
  }
  .fl .t{
    display:block;
    /* 单行不折行：只有不折行，字号才能反算到"刚好铺满宽度"。
       例外：反算结果小于"可读下限"时，改折两行（见 fitForumTitles）。 */
    white-space:nowrap;
    font-weight:550;line-height:1.08;letter-spacing:-.03em;
  }

  #forum-tail{
    position:absolute;left:8cqw;right:8cqw;bottom:7cqw;
    opacity:0;
  }
  #forum-tail p{
    margin:0;font-size:max(11px,1.2cqw);color:var(--ink-2);
    letter-spacing:.04em;line-height:1.7;
  }

  /* ============================================================
     3 · 影集：照片自下而上擦除
     ============================================================ */
  #s-albums{display:block}
  .shot{
    position:absolute;overflow:hidden;background:#f4f4f6;
    clip-path:inset(100% 0 0 0);
  }
  .shot img{
    width:100%;height:100%;object-fit:cover;display:block;
    will-change:transform;
  }
  #alb-cap{
    position:absolute;left:8cqw;bottom:7.4cqw;right:8cqw;
  }
  #alb-cap .q{
    margin:0;font-size:clamp(13px,1.62cqw,27px);line-height:1.68;
    letter-spacing:.005em;color:var(--ink);
  }
  #alb-cap .k{
    margin:0 0 1.1cqw;font-size:max(10px,1.02cqw);letter-spacing:.2em;
    color:var(--ink-3);font-family:ui-monospace,"SF Mono",Menlo,monospace;
  }

  /* ============================================================
     4 · 生日：33 格，其中一格亮红
     ============================================================ */
  #bd-wrap{
    position:absolute;left:0;right:0;bottom:8.4cqw;
    text-align:center;
  }
  #bd-wrap .big{
    margin:0;font-size:clamp(19px,3.5cqw,58px);font-weight:550;
    letter-spacing:-.01em;line-height:1.3;
  }
  #bd-wrap .sub{
    margin:1.5cqw 0 0;font-size:max(11px,1.24cqw);color:var(--ink-2);
    letter-spacing:.08em;
  }

  /* ============================================================
     5 · 数字：一屏一个
     ============================================================ */
  #s-numbers{justify-content:center}
  #num-big{
    font-size:clamp(76px,25cqw,420px);font-weight:500;
    line-height:.8;letter-spacing:-.055em;font-variant-numeric:tabular-nums;
  }
  #num-label{
    margin-top:3.4cqw;font-size:clamp(13px,1.58cqw,26px);
    color:var(--ink-2);letter-spacing:.06em;
  }
  #num-idx{
    position:absolute;right:4.6cqw;top:5.6cqw;
    font-family:ui-monospace,"SF Mono",Menlo,monospace;
    font-size:max(10px,1cqw);letter-spacing:.16em;color:var(--ink-3);
  }

  /* ============================================================
     6 · 尺度：全片最长的一次停顿
     ============================================================ */
  #s-scale{padding:0 12cqw}
  #scale-a,#scale-b{
    margin:0;font-size:clamp(19px,3.35cqw,56px);
    font-weight:500;line-height:1.42;letter-spacing:-.015em;
    text-align:left;width:100%;
  }
  #scale-b{margin-top:2.6cqw;color:var(--ink-2)}
  #scale-b em{font-style:normal;color:var(--ink)}

  /* ============================================================
     7 · 咖啡
     ============================================================ */
  /* 竖线拆成上下两段：文字块上下一段各留缺口，从缺口向外长。
     ⚠️ 不要在这里写 scaleY(0)。早前是 `transform:...scaleY(0)`，
        而 JS 只改 height —— 高度怎么长都被 scaleY(0) 压成零，
        竖线永远不出现（截图里那一幕只剩一行字，构图塌了）。
     ⚠️ 也不要改回"一根整线 + 给文字加白底"：白底会盖住全片那层
        2.8% 的颗粒，纯白舞台上能看出一块浅灰方块（已实证）。 */
  #cafe-line,#cafe-line2{
    position:absolute;left:50%;width:1px;height:0;
    background:var(--ink);opacity:0;
    transform:translateX(-50%);
  }
  /* 文字块不再需要白底，线在它上下断开就够 */
  #cafe-wrap{position:relative;z-index:2;text-align:center;padding:0 6cqw}
  #cafe-k{
    margin:0 0 2cqw;font-family:ui-monospace,"SF Mono",Menlo,monospace;
    font-size:max(10px,1.02cqw);letter-spacing:.26em;color:var(--ink-3);
  }
  #cafe-q{
    margin:0;font-size:clamp(20px,3.6cqw,60px);font-weight:550;
    letter-spacing:-.015em;line-height:1.28;
    /* 竖线在文字**上方**、不穿过文字：给自己留一层白底，
       同时把线的高度限制在文字块之上（见 animCafe 里的 12cqw）。 */
    position:relative;z-index:2;
  }

  /* ============================================================
     8 · 收尾
     ============================================================ */
  #end-wrap{
    position:absolute;left:0;right:0;bottom:0;top:56%;
    display:flex;flex-direction:column;align-items:center;
  }
  #end-name{
    margin:0;font-size:clamp(20px,3.1cqw,52px);font-weight:500;
    letter-spacing:.01em;
  }
  #end-line{
    margin:1.5cqw 0 0;font-size:clamp(12px,1.5cqw,25px);
    color:var(--ink-2);letter-spacing:.05em;
  }
  #end-meta{
    margin:2.8cqw 0 0;font-family:ui-monospace,"SF Mono",Menlo,monospace;
    font-size:max(9px,.9cqw);letter-spacing:.16em;color:var(--ink-3);
  }

  /* ============================================================
     竖屏覆盖 —— 必须放在样式表**最后**
     ------------------------------------------------------------
     早前把媒体查询写在中段，被后面同优先级的基础规则整块盖掉，
     表现为「改了手机端但页面毫无变化」。
     ⚠️ 这里只用 cqw，不用 cqh：`#stage` 是 container-type:inline-size，
        cqh 不按舞台高度解析，会回退到视口高度（844px），字号直接翻倍。
     ============================================================ */
  @media (max-width:760px){
    #film{padding:0 0 8vh}
    #stage{width:100vw}

    /* 竖屏：文字按 cqw 缩、画布图形按整幅缩，比例不同。
       canvas 侧另有一档 yearScale（见 fit/drawYear），这里把
       标题与计数收小，给收窄后的年历让出上下两条干净边。 */
    #yr-head{left:7cqw;top:6cqw;gap:1.5cqw}
    #yr-year{font-size:5.2cqw}
    #yr-cap{font-size:2.3cqw;letter-spacing:.14em}
    #yr-foot{left:7cqw;right:7cqw;bottom:8cqw;gap:3cqw}
    #yr-count{font-size:8.5cqw}
    #yr-unit{font-size:2.8cqw;padding-bottom:1.2cqw}
    #yr-note{font-size:2.3cqw;line-height:1.55}

    .fl{left:8cqw;right:8cqw}
    .fl .d{font-size:2.6cqw;margin-bottom:2.4cqw}
    .fl .t{font-size:7.6cqw}
    #forum-tail{left:8cqw;right:8cqw;bottom:9cqw}
    #forum-tail p{font-size:2.9cqw;line-height:1.6}

    #alb-cap{left:7cqw;right:7cqw;bottom:8cqw}
    #alb-cap .q{font-size:3.3cqw;line-height:1.55}
    #alb-cap .k{font-size:2.4cqw;margin-bottom:2cqw}

    #bd-wrap{bottom:9cqw}
    #bd-wrap .big{font-size:5.4cqw}
    #bd-wrap .sub{font-size:3cqw;margin-top:2.4cqw}

    #num-big{font-size:34cqw}
    #num-label{font-size:3.4cqw;margin-top:4.6cqw}
    #num-idx{right:7cqw;top:9cqw;font-size:2.4cqw}

    #s-scale{padding:0 8cqw}
    #scale-a,#scale-b{font-size:5cqw;line-height:1.5}
    #scale-b{margin-top:3.4cqw}

    #cafe-k{font-size:2.5cqw;margin-bottom:2.6cqw}
    #cafe-q{font-size:5.6cqw}

    #end-wrap{top:52%}
    #end-name{font-size:5.4cqw}
    #end-line{font-size:3.1cqw;margin-top:2.2cqw}
    #end-meta{font-size:2.3cqw;margin-top:3.4cqw}

    .src{right:7cqw;bottom:4.4cqw;font-size:2.1cqw}
  }
</style>
</head>
<body>

<div id="film">
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="grain"></div>

    <div id="type">
      <section class="sc" id="s-year">
        <div id="yr-head">
          <div id="yr-year">2026</div>
          <div id="yr-cap">BLOCK OF HOME · 年终</div>
        </div>
        <div id="yr-foot">
          <div id="yr-count">0</div>
          <div id="yr-unit">个帖子</div>
          <div id="yr-note"></div>
        </div>
        <span class="src">/forum · 实时统计</span>
      </section>

      <section class="sc" id="s-forum">
        <div id="forum-stack"></div>
        <div id="forum-tail"><p></p></div>
        <span class="src">/forum</span>
      </section>

      <section class="sc" id="s-albums">
        <div id="alb-cap">
          <p class="k">社区影集 · /albums</p>
          <p class="q"></p>
        </div>
        <span class="src">/albums</span>
      </section>

      <section class="sc" id="s-birthday">
        <div id="bd-wrap">
          <p class="big"></p>
          <p class="sub"></p>
        </div>
        <span class="src">/birthday</span>
      </section>

      <section class="sc" id="s-numbers">
        <div id="num-big">0</div>
        <div id="num-label"></div>
        <span id="num-idx"></span>
      </section>

      <section class="sc" id="s-scale">
        <p id="scale-a"></p>
        <p id="scale-b"></p>
        <span class="src">/boh-8-years-journey</span>
      </section>

      <section class="sc" id="s-cafe">
        <div id="cafe-line"></div>
        <div id="cafe-line2"></div>
        <div id="cafe-wrap">
          <p id="cafe-k">云上咖啡店 · 八周年营业日</p>
          <p id="cafe-q"></p>
        </div>
        <span class="src">/anniversary-cafe</span>
      </section>

      <section class="sc" id="s-end">
        <div id="end-wrap">
          <p id="end-name"></p>
          <p id="end-line"></p>
          <p id="end-meta">BLOCK OF HOME · 2018—2026</p>
        </div>
      </section>
    </div>

    <button id="again" type="button">再看一遍</button>
  </div>
</div>

<div id="rotate">横屏观看体验更好</div>
<div id="chap"></div>

<div id="chrome">
  <button class="cbtn" id="play" type="button" aria-label="暂停">
    <svg viewBox="0 0 12 12" aria-hidden="true"><rect x="1.5" y="1" width="3" height="10" fill="currentColor"/><rect x="7.5" y="1" width="3" height="10" fill="currentColor"/></svg>
  </button>
  <div id="track" role="slider" aria-label="进度" tabindex="0" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
    <div class="bar"><div class="fill"></div></div>
    <div class="marks"></div>
  </div>
  <button class="cbtn" id="mute" type="button" aria-label="开启声音" title="声音">
    <svg viewBox="0 0 14 14" aria-hidden="true">
      <path d="M2 5.2h2L7 2.6v8.8L4 8.8H2z" fill="currentColor"/>
      <path id="wave" d="M9.1 5.3a2.4 2.4 0 010 3.4M10.7 3.9a4.6 4.6 0 010 6.2" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/>
      <path id="slash" d="M9.4 5.2l3 3.6M12.4 5.2l-3 3.6" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/>
    </svg>
  </button>
  <div id="tc"><b>00:00</b></div>
</div>

<!-- 影集用的三张实拍截图（源文件 src/assets/images/*.webp）内联成 data URI ——
     目的是让这一个 HTML 能脱离仓库单独分发（发微信、丢给同事双击就播）。
     要换图：重新 base64 一次替换下面三条即可；键名与 SHOTS 里的 key 对应。 -->

<script>
(() => {
  'use strict';

  /* ============================================================
     0. 工具
     ============================================================ */
  const $ = (s, r = document) => r.querySelector(s);
  const clamp = (v, a = 0, b = 1) => v < a ? a : v > b ? b : v;
  const mix = (a, b, t) => a + (b - a) * t;

  const easeOut = p => 1 - Math.pow(1 - p, 3);
  const easeOutQuint = p => 1 - Math.pow(1 - p, 5);
  const easeInOut = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;

  const seg = (local, a, b) => clamp((local - a) / (b - a));

  const stage = $('#stage');
  const cv = $('#cv');
  const ctx = cv.getContext('2d');
  const grain = $('#grain');
  const againBtn = $('#again');
  const chapEl = $('#chap');
  const track = $('#track');
  const fill = $('#track .fill');
  const tcEl = $('#tc');
  const playBtn = $('#play');
  const rotateHint = $('#rotate');
  const muteBtn = $('#mute');

  const W = 1600, H = 900;
  let pxScale = 1;
  let appleScale = 1;
  /* 窄屏（竖屏手机）专用：DOM 文字按 cqw 缩，canvas 图形却按整幅比例缩，
     两者比例不一致 —— 390 宽时年历网格会压住「2026」和底部的 165。
     所以窄屏把网格整体收一档（见 drawYear）。 */
  let yearScale = 1;

  function splitChars(el, text) {
    el.innerHTML = '';
    const out = [];
    for (const ch of text) {
      const i = document.createElement('i');

     它永远返回父容器的整行宽度（实测所有条目都是 1207px），

  const measureCtx = document.createElement('canvas').getContext('2d');

    const maxPx = w * 0.42;
    const minPx = Math.max(15, w * 0.028);

    for (const L of forumLines) {
      measureCtx.font = lineCtxFont(100);
      const unit = measureCtx.measureText(L.text).width || 1;
      const charCount = [...L.text].length;
      const tracked = Math.max(unit - charCount * 3, 1);
      const oneLine = (avail / tracked) * 100;
      const smallForTitle = w * 0.07;

      if (oneLine >= smallForTitle) {
        L.tt.style.whiteSpace = 'nowrap';
        L.tt.style.wordBreak = 'normal';
        const size = clamp(oneLine, minPx, maxPx);
        L.tt.style.fontSize = size.toFixed(1) + 'px';
        L.size = size;
        L.lines = 1;
        continue;
      }

      /* 折行：**先按理想值放大，再实测行数，超了就回退**。
         ------------------------------------------------------------
         早前靠"系数猜"：√2 刚好两行、1.82 变三行、√2×1.18 又变三行。

      L.tt.style.whiteSpace = 'normal';

      const countLines = () => Math.max(1, Math.round(L.tt.getBoundingClientRect().height / lh()));

      let size = Math.max(oneLine * Math.SQRT2 * 1.22, minPx);
      L.tt.style.fontSize = size.toFixed(1) + 'px';

      for (let iter = 0; iter < 4 && countLines() > 2; iter++) {
        size *= 0.9;
        L.tt.style.fontSize = size.toFixed(1) + 'px';

  const Sound = (() => {
    let actx = null, master = null, bed = null;
    let muted = true;

    function ensure() {
      if (actx) return actx;
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      actx = new AC();
      master = actx.createGain();
      master.gain.value = 0;
      master.connect(actx.destination);
      return actx;
    }

    function startBed() {
      if (!actx || bed) return;
      const g = actx.createGain();
      g.gain.value = 0;
      g.connect(master);
      g.gain.linearRampToValueAtTime(0.05, actx.currentTime + 4);

      const o = actx.createOscillator();
      o.type = 'sine';
      o.frequency.value = 62;
      const og = actx.createGain();
      og.gain.value = 0.7;
      o.connect(og).connect(g);
      o.start();

      const len = actx.sampleRate * 4;
      const buf = actx.createBuffer(1, len, actx.sampleRate);
      const d = buf.getChannelData(0);
      let b0 = 0, b1 = 0, b2 = 0;
      for (let i = 0; i < len; i++) {
        const w = Math.random() * 2 - 1;
        b0 = 0.99765 * b0 + w * 0.0990460;
        b1 = 0.96300 * b1 + w * 0.2965164;
        b2 = 0.57000 * b2 + w * 1.0526913;
        d[i] = (b0 + b1 + b2 + w * 0.1848) * 0.14;
      }
      const src = actx.createBufferSource();
      src.buffer = buf;
      src.loop = true;
      const hp = actx.createBiquadFilter();
      hp.type = 'highpass';
      hp.frequency.value = 1800;
      const ng = actx.createGain();
      ng.gain.value = 0.028;
      src.connect(hp).connect(ng).connect(g);
      src.start();
      bed = g;
    }

    function tap(level = 0.5) {
      if (!actx || muted) return;
      const now = actx.currentTime;
      const len = Math.floor(actx.sampleRate * 0.038);
      const buf = actx.createBuffer(1, len, actx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 9);
      const s = actx.createBufferSource();
      s.buffer = buf;
      const bp = actx.createBiquadFilter();
      bp.type = 'bandpass';
      bp.frequency.value = 3600;
      bp.Q.value = 1.1;
      const g = actx.createGain();
      g.gain.value = level * 0.07;
      s.connect(bp).connect(g).connect(master);
      s.start(now);
      s.stop(now + 0.04);
    }

    function thump(level = 1) {
      if (!actx || muted) return;
      const now = actx.currentTime;
      const o = actx.createOscillator();
      o.type = 'sine';
      o.frequency.setValueAtTime(96, now);
      o.frequency.exponentialRampToValueAtTime(44, now + 0.3);
      const g = actx.createGain();
      g.gain.setValueAtTime(0, now);
      g.gain.linearRampToValueAtTime(0.12 * level, now + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, now + 0.38);
      o.connect(g).connect(master);
      o.start(now);
      o.stop(now + 0.4);
    }

    function setMuted(v) {
      muted = v;
      if (!v) {
        if (!ensure()) return;
        if (actx.state === 'suspended') actx.resume();
        startBed();
        master.gain.cancelScheduledValues(actx.currentTime);
        master.gain.linearRampToValueAtTime(0.5, actx.currentTime + 0.6);
      } else if (actx) {
        master.gain.cancelScheduledValues(actx.currentTime);
        master.gain.linearRampToValueAtTime(0, actx.currentTime + 0.15);
      }
    }

    return {
      get muted() { return muted; },
      toggle() { setMuted(!muted); return muted; },
      tap, thump,
      cue(id) {
        if (muted) return;
        if (id === 'numbers' || id === 'end') thump(0.85);
        else if (id === 'forum') tap(0.35);
        else tap(0.6);
      },
    };
  })();

  /* ---------- 年历：12 行（月）× 31 列（日） ---------- */
  const CAL = (() => {
    const COLS = 31, ROWS = 12;
    /* 尺寸要让年历**撑满画框**：早前 cell=30/gap=5 只占了 1085×415，
       在 900 高的画框里缩在上半截，中间一大块死白。
       现在 cell=38/gap=6 → 1358×522，配合 oy=0.315H 垂直居中。 */
    const cell = 36, gap = 6;
    const spanX = COLS * cell + (COLS - 1) * gap;
    const spanY = ROWS * cell + (ROWS - 1) * gap;
    const ox = (W - spanX) / 2;
    /* 网格必须整体下移，给左上角的「2026 / 年终」腾出干净的空间。
       早前 oy 按 0.315H 居中，网格顶边压到 y=90，正好盖住标题。 */
    const oy = H * 0.40 - spanY / 2;

    /* 每个真实发帖日 → 该日的累计序号（用于「按时间点亮」） */
    const map = new Map();
    DAYS.forEach(d => map.set(d[0] + '-' + d[1], d[2]));

    // 该月天数
    const mdays = [31,28,31,30,31,30,31,31,30,31,30,31];

    const cells = [];
    let order = 0;
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        if (c >= mdays[r]) continue;
        const key = (r + 1) + '-' + (c + 1);
        const n = map.get(key) || 0;
        cells.push({
          r, c,
          x: ox + c * (cell + gap) + cell / 2,
          y: oy + r * (cell + gap) + cell / 2,
          n,
          ord: n ? order++ : -1,
        });
      }
    }
    return { cells, cell, total: order, cx: W / 2, cy: oy + spanY / 2 };
  })();

  function drawYear(local) {
    const { cells, cell, cx, cy } = CAL;

    /* 窄屏把整张年历绕画面中心等比收一档，给上下两端的文字让位。
       每个格子都是单独 fillRect，所以直接套一层 ctx.scale 最省事；
       缩放中心取 (W/2, H/2)，飞入起点 cx/cy 也在中心，动画不用改。 */
    ctx.save();
    if (yearScale !== 1) {
      ctx.translate(W / 2, H / 2);
      ctx.scale(yearScale, yearScale);
      ctx.translate(-W / 2, -H / 2);
    }

    /* 展开：所有格子从画面中心飞出到自己的位置。
       第一行先动，逐行跟随 —— 读起来像「一年被长出来」，而不是网格凭空出现。 */
    for (const q of cells) {
      const t0 = 0.75 + q.r * 0.085;
      const p = easeOut(seg(local, t0, t0 + 1.05));
      if (p <= 0) continue;

      const x = mix(cx, q.x, p);
      const y = mix(cy, q.y, p);
      const s = mix(cell * 0.34, cell, p);

      if (q.n === 0) {
        // 空白日：只有一道极淡的描边
        ctx.strokeStyle = `rgba(10,10,10,${(0.055 * p).toFixed(3)})`;
        ctx.lineWidth = 1;
        ctx.strokeRect(x - s / 2 + .5, y - s / 2 + .5, s - 1, s - 1);
      } else {
        /* 有帖子的日子：按时间顺序逐个变黑。
           深浅按当日帖数分三档 —— 3/18 那天 29 帖，是全片最黑的一格。 */
        const fill0 = 3.1 + q.ord * 0.038;
        const f = easeOut(seg(local, fill0, fill0 + 0.34));
        if (f <= 0) {
          ctx.strokeStyle = `rgba(10,10,10,${(0.055 * p).toFixed(3)})`;
          ctx.lineWidth = 1;
          ctx.strokeRect(x - s / 2 + .5, y - s / 2 + .5, s - 1, s - 1);
        } else {
          const lv = mix(255, q.n >= 4 ? 10 : q.n >= 2 ? 74 : 146, f);
          ctx.fillStyle = `rgb(${lv|0},${lv|0},${(lv + 2) | 0})`;
          ctx.fillRect(x - s / 2, y - s / 2, s, s);
        }
      }
    }
    ctx.restore();
  }

  /* ---------- 生日：33 格，一格亮红 ---------- */
  function drawBirthday(local) {
    const COLS = 11;
    /* 🔴 网格要够大才撑得住画面。早前 cell=26/gap=8 只有 366px 宽，
       在 1600 宽的画框里是一小撮方块，中间空得厉害。 */
    const cell = 52, gap = 16;
    const spanX = COLS * cell + (COLS - 1) * gap;
    const ox = (W - spanX) / 2;
    const spanY = Math.ceil(STATS.members / COLS) * cell + (Math.ceil(STATS.members / COLS) - 1) * gap;
    const oy = H * 0.44 - spanY / 2;

    /* 🔴 寿星那一格必须落在**索引范围内**。
       早前写死 hot = 46，而 STATS.members = 33 —— i 最多到 32，
       永远命中不了，于是全片没有一格是红的（「有一个人过生日」
       这句话在画面上没有任何对应物）。
       现在取网格正中间那一格，且用成员数兜底。 */
    const hot = Math.min(16, STATS.members - 1);

    for (let i = 0; i < STATS.members; i++) {
      const r = Math.floor(i / COLS), c = i % COLS;
      const t0 = 0.25 + i * 0.026;
      const p = easeOut(seg(local, t0, t0 + 0.5));
      if (p <= 0) continue;
      const x = ox + c * (cell + gap);
      const y = oy + r * (cell + gap);
      const s = cell * mix(0.4, 1, p);

      if (i === hot) {
        ctx.fillStyle = '#c8262c';
        ctx.fillRect(x + (cell - s) / 2, y + (cell - s) / 2, s, s);
      } else {
        ctx.fillStyle = `rgba(10,10,10,${(0.68 * p).toFixed(3)})`;
        ctx.fillRect(x + (cell - s) / 2, y + (cell - s) / 2, s, s);
      }
    }
  }

  /* ---------- 收尾：像素苹果逐格亮起 ---------- */
  const APPLE = [
    '.....bb.....',
    '.....b......',
    '...rrrrr....',
    '..rrhrrrrr..',
    '.rrhhrrrrrr.',
    '.rrrrrrrrrr.',
    '.rrrrrrrrrr.',
    '..rrrrrrrr..',
    '...rrrrrr...',
    '....rrrr....',
  ];
  const APPLE_PAL = { r: '#c8262c', h: '#e8616a', b: '#5c3417' };

  const APPLE_CELLS = (() => {
    const out = [];
    const h = APPLE.length, w = APPLE[0].length;
    for (let r = 0; r < h; r++) {
      for (let c = 0; c < w; c++) {
        const ch = APPLE[r][c];
        if (ch === '.') continue;
        const dx = c - (w - 1) / 2, dy = r - (h - 1) / 2;
        out.push({ r, c, ch, d: Math.hypot(dx, dy) });
      }
    }
    out.sort((a, b) => a.d - b.d);
    const maxD = out[out.length - 1].d || 1;
    out.forEach(o => { o.t = o.d / maxD; });
    return out;
  })();

  function drawApple(local, alpha) {
    if (alpha <= 0.002) return;
    const cell = mix(38, 31, easeInOut(seg(local, 0.2, 2.6))) * appleScale;
    const h = APPLE.length, w = APPLE[0].length;
    const ox = W / 2 - (w * cell) / 2;
    const oy = H * 0.27 - (h * cell) / 2;
    const gap = 2.5;

    for (const o of APPLE_CELLS) {
      const begin = 0.10 + o.t * 1.25;
      const p = easeOutQuint(seg(local, begin, begin + 0.58));
      if (p <= 0) continue;
      const col = APPLE_PAL[o.ch];
      if (!col) continue;
      const s = cell * p;
      const x = ox + o.c * cell + (cell - s) / 2;
      const y = oy + o.r * cell + (cell - s) / 2;
      ctx.globalAlpha = alpha * clamp(p);
      ctx.fillStyle = col;
      ctx.fillRect(x, y, Math.max(0, s - gap), Math.max(0, s - gap));
    }
    ctx.globalAlpha = 1;
  }

  /* ============================================================
     7. 每幕动效
     ============================================================ */

  /* ---- 1 年历 ---- */
  function animYear(local) {
    drawYear(local);

    // 计数：跟着点亮的节奏一起数上去
    const cnt = $('.sc#s-year #yr-count');
    const prog = easeInOut(seg(local, 3.2, 6.0));
    cnt.textContent = Math.round(STATS.posts * prog);

    const note = $('.sc#s-year #yr-note');
    const nIn = easeOut(seg(local, 5.4, 6.4));
    note.style.opacity = nIn.toFixed(3);
    note.innerHTML = `落在 ${STATS.days} 天里<br>最黑的一格，是 3 月 18 日`;

    const head = $('#yr-head');
    head.style.opacity = easeOut(seg(local, 0.05, 0.7)).toFixed(3);
  }

  /* ---- 2 论坛：从屏幕外大字号飞入 → 缩小 → 落定并铺满 ---- */
  const FORUM_PER = 1.42;   // 每条停留（含飞入 + 停稳）
  const FORUM_HOLD = 2.5;   // 最后一条多留（情绪落点）

  function animForum(local) {
    const n = forumLines.length;
    const cut = (n - 1) * FORUM_PER;
    let idx, inLine;

    if (local < cut) {
      idx = Math.floor(local / FORUM_PER);
      inLine = local - idx * FORUM_PER;
    } else {
      idx = n - 1;
      inLine = local - cut;
    }
    idx = Math.min(idx, n - 1);

    forumLines.forEach((L, i) => {
      if (i === idx) L.box.classList.add('on');
      else L.box.classList.remove('on');
    });

    const L = forumLines[idx];

    /* 用户的话：从屏幕外飞进来，一边飞一边从「大得看不全」缩到刚好铺满。
       ------------------------------------------------------------
       三件事同时发生，才有"飞进来"的实感，缺一个都不成立：
       1. 缩放：2.9 → 1.0（起点 2.9 意味着只有几个字塞满屏幕，读不出内容，
          这种"先看不清、再读清"正是 Apple 片头常用的手法）
       2. 位移：从画面外斜着飞入（左上来，右下去，交替），而不是原地放大
       3. 透明度：0 → 1，前 40% 就走完，避免大字号时字太重、边缘发糊
       缓动用 easeOutQuint：一开始快、最后极慢地"落定"，
       浏览器默认 ease 会显得软绵绵，没有冲进画面的冲量。 */
    const p = easeOutQuint(seg(inLine, 0, 0.72));
    const dir = idx % 2 === 0 ? 1 : -1;          // 交替方向，避免看久了有规律感
    const dx = (1 - p) * dir * 62;               // 单位 cqw → 之后换算成 px
    const dy = (1 - p) * (dir > 0 ? -34 : 34);
    const sc = mix(2.9, 1, p);
    const op = easeOut(seg(inLine, 0, 0.34));

    L.inner.style.transform =
      `translate(${dx.toFixed(2)}cqw, ${dy.toFixed(2)}cqw) scale(${sc.toFixed(4)})`;
    L.inner.style.opacity = op.toFixed(3);

    // 日期标签稍微晚一点出现，像"话落定了，日期才补上"
    L.dd.style.opacity = easeOut(seg(inLine, 0.5, 0.95)).toFixed(3);

    // 尾巴：一行总结
    const tailAt = cut + FORUM_HOLD - 1.7;
    const te = easeOut(seg(local, tailAt, tailAt + 0.9));
    const tail = $('#forum-tail');
    tail.style.opacity = te.toFixed(3);
    tail.style.transform = `translateY(${(1 - te) * 14}px)`;
    $('#forum-tail p').innerHTML =
      `这一年 ${STATS.posts} 个帖子，${STATS.replies} 条回复。<br>大部分都在讲自己，讲得挺好。`;
  }

  /* ---- 3 影集 ---- */
  function animAlbums(local) {
    const starts = [0.35, 1.05, 1.62];
    shotEls.forEach((s, i) => {
      const p = easeInOut(seg(local, starts[i], starts[i] + 1.5));
      s.box.style.clipPath = `inset(${(1 - p) * 100}% 0% 0% 0%)`;
      // 图片反向位移：擦除时画面在动，像真的在被翻出来
      s.img.style.transform = `scale(${mix(1.16, 1, p).toFixed(3)}) translateY(${(1 - p) * -3}%)`;
    });

    /* 影集幕的字必须**遮蔽**后升起。
       早前直接 translateY(110%) —— 字沉到 <p> 外面，
       而 <p> 没有 overflow 约束，结果整段标题被裁得只剩一个角，
       截图里那一幕完全看不到这句文案。 */
    const qCharsMasked = splitCharsMaskedCached(
      $('#alb-cap .q'),
      '居民们亲手装帧的影集，翻开就是一段一段被认真整理过的时光。'
    );
    qCharsMasked.forEach(({ i }, k) => {
      const b = 3.1 + k * 0.026;
      const p = easeOut(seg(local, b, b + 0.6));
      i.style.transform = `translateY(${(1 - p) * 108}%)`;
    });

    const k = $('#alb-cap .k');
    k.style.opacity = easeOut(seg(local, 2.6, 3.2)).toFixed(3);
  }

  // 带缓存的逐字拆分（每帧重拆会疯狂建节点）
  const charCache = new WeakMap();
  function splitCharsCached(el, text) {
    if (!charCache.has(el)) charCache.set(el, splitChars(el, text));
    return charCache.get(el);
  }

  /* 逐字 + 每个字一层 overflow:hidden 的 mask。
     需要「字从地里长出来」效果的地方都用这个，别再直接 translateY ——
     没有 mask 的字在途中是可见的（歪在不同高度），而且往下移动时会
     被父容器的裁切吃掉，整段文字看起来消失。 */
  const maskedCache = new WeakMap();
  function splitCharsMaskedCached(el, text) {
    if (maskedCache.has(el)) return maskedCache.get(el);
    el.innerHTML = '';
    const out = [];
    for (const ch of text) {
      const mask = document.createElement('span');
      mask.className = 'lmask';
      const i = document.createElement('i');
      i.textContent = ch === ' ' ? '\u00a0' : ch;
      mask.appendChild(i);
      el.appendChild(mask);
      out.push({ mask, i });
    }
    maskedCache.set(el, out);
    return out;
  }

  /* ---- 4 生日 ---- */
  function drawBirthdayScene(local) {
    drawBirthday(local);

    bdBig.forEach((ch, i) => {
      const b = 1.45 + i * 0.048;
      const p = easeOut(seg(local, b, b + 0.62));
      ch.style.transform = `translateY(${(1 - p) * 112}%)`;
      ch.style.opacity = p.toFixed(3);
    });
    bdSub.forEach((ch, i) => {
      const b = 3.0 + i * 0.03;
      const p = easeOut(seg(local, b, b + 0.6));
      ch.style.transform = `translateY(${(1 - p) * 112}%)`;
      ch.style.opacity = p.toFixed(3);
    });
  }

  /* ---- 5 数字：一屏一个 ---- */
  const NUM_PER = 1.6;

  function animNumbers(local) {
    let i = Math.floor(local / NUM_PER);
    i = Math.min(i, NUMBERS.length - 1);
    const [val, unit] = NUMBERS[i];

    numBig.textContent = String(val);
    numLabel.textContent = unit;
    numIdx.textContent = String(i + 1).padStart(2, '0') + ' / ' + String(NUMBERS.length).padStart(2, '0');

    // 每次切换时字从下方顶上来（硬切，只给入场）
    const inSlot = local - i * NUM_PER;
    const p = easeOut(seg(inSlot, 0.02, 0.4));
    numBig.style.transform = `translateY(${(1 - p) * 9}px)`;
    numBig.style.opacity = p.toFixed(3);
    numLabel.style.opacity = easeOut(seg(inSlot, 0.16, 0.5)).toFixed(3);
  }

  /* ---- 6 尺度：全片最长停顿 ---- */
  function animScale(local) {
    scaleA.forEach((ch, i) => {
      const b = 0.35 + i * 0.034;
      const p = easeOut(seg(local, b, b + 0.75));
      ch.style.transform = `translateY(${(1 - p) * 112}%)`;
      ch.style.opacity = p.toFixed(3);
    });
    scaleB.forEach((ch, i) => {
      const b = 1.9 + i * 0.04;
      const p = easeOut(seg(local, b, b + 0.75));
      ch.style.transform = `translateY(${(1 - p) * 112}%)`;
      ch.style.opacity = mix(0.15, 0.78, p).toFixed(3);
    });
    // 收尾整体轻微上浮淡出，给下一幕留气口
    const out = easeInOut(seg(local, 6.9, 8.0));
    const sc = $('#s-scale');
    sc.style.transform = `translateY(${-out * 12}px)`;
    sc.style.opacity = (1 - out).toFixed(3);
  }

  /* ---- 7 咖啡 ---- */
  function animCafe(local) {
    if (!cafeGeo) measureCafe();
    const lp = easeInOut(seg(local, 0.15, 1.1));

    /* 两段线各自从文字缺口向外长：上段用 bottom 锚住下端、
       下段用 top 锚住上端，所以字不会动、线也不会撞字。 */
    if (cafeGeo) {
      const g = cafeGeo;
      cafeLine.style.bottom = (g.h - g.topA).toFixed(1) + 'px';
      cafeLine.style.height = (g.lenUp * lp).toFixed(1) + 'px';
      cafeLine.style.opacity = (lp * 0.9).toFixed(3);
      cafeLine2.style.top = g.botA.toFixed(1) + 'px';
      cafeLine2.style.height = (g.lenDn * lp).toFixed(1) + 'px';
      cafeLine2.style.opacity = (lp * 0.9).toFixed(3);
    }

    const k = $('#cafe-k');
    k.style.opacity = easeOut(seg(local, 0.55, 1.2)).toFixed(3);

    cafeQ.forEach((ch, i) => {
      const b = 1.05 + i * 0.03;
      const p = easeOut(seg(local, b, b + 0.6));
      ch.style.transform = `translateY(${(1 - p) * 112}%)`;
      ch.style.opacity = p.toFixed(3);
    });
  }

  /* ---- 8 收尾 ---- */
  function animEnd(local) {
    /* 淡出进度：文字块与 canvas 上的 logo 用**同一条曲线**（各算一次），
       不再共享一个可变状态 —— 早前用 endLogoAlpha 在中途互通，
       且 renderAt 里又单独画了一遍 logo，淡出被乘了两次。 */
    const fo = easeInOut(seg(local, 6.4, 8.6));

    endName.forEach((ch, i) => {
      const b = 1.5 + i * 0.06;
      const p = easeOut(seg(local, b, b + 0.66));
      ch.style.transform = `translateY(${(1 - p) * 112}%)`;
      ch.style.opacity = p.toFixed(3);
    });
    endLine.forEach((ch, i) => {
      const b = 2.35 + i * 0.038;
      const p = easeOut(seg(local, b, b + 0.66));
      ch.style.transform = `translateY(${(1 - p) * 112}%)`;
      ch.style.opacity = p.toFixed(3);
    });

    const meta = $('#end-meta');
    meta.style.opacity = (easeOut(seg(local, 3.1, 3.9)) * (1 - fo)).toFixed(3);

    const wrapEl = $('#end-wrap');
    wrapEl.style.transform = `translateY(${-fo * 16}px)`;
    wrapEl.style.opacity = (1 - fo).toFixed(3);
  }

  /* ============================================================
     8. 主渲染
     ============================================================ */
  function fit() {
    const r = stage.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = Math.max(1, Math.round(r.width * dpr));
    const h = Math.max(1, Math.round(r.height * dpr));
    if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
    pxScale = cv.width / W;
    ctx.setTransform(pxScale, 0, 0, pxScale, 0, 0);
    appleScale = r.width < 640 ? 0.78 : 1;
    yearScale = r.width < 760 ? 0.62 : 1;
  }
  fit();
  window.addEventListener('resize', fit);

  let t = 0, playing = true, last = performance.now(), ended = false;
  let curIdx = -1;
  let seeking = false;

  const DRAW = {
    year: animYear,
    forum: animForum,
    albums: animAlbums,
    birthday: drawBirthdayScene,
    numbers: animNumbers,
    scale: animScale,
    cafe: animCafe,
    end: animEnd,
  };

  function renderAt(time) {
    let idx = SCENES.length - 1;
    for (let i = 0; i < SCENES.length; i++) {
      if (time < SCENES[i].start + SCENES[i].dur) { idx = i; break; }
    }
    const s = SCENES[idx];
    const local = Math.max(0, time - s.start);

    if (idx !== curIdx) {
      // 硬切：只切可见性，不做过渡
      if (curIdx >= 0) wrap(SCENES[curIdx].id).classList.remove('on');
      wrap(s.id).classList.add('on');
      curIdx = idx;
      chapEl.textContent = s.label;
      /* 🔴 复位必须是**清空内联样式**，不能赋 '1'。
         早前这里写 `el.style.opacity = '1'`，等于给每一幕都打了一个内联
         opacity:1，直接盖掉 `.sc{opacity:0}` —— 于是所有幕同时可见。
         而 `.fl.on{visibility:visible}` 又会覆盖父级的 visibility:hidden
         （visibility 是继承属性，后代可以显式恢复），
         结果就是上一幕的帖子标题挂在下一幕画面上。 */
      SCENES.forEach(x => {
        const el = wrap(x.id);
        el.style.opacity = '';
        el.style.transform = '';
      });
      if (!seeking) Sound.cue(s.id);
    }

    ctx.clearRect(0, 0, W, H);

    /* 片尾的像素苹果画在 canvas 上（其他幕不画）。
       ⚠️ 只在这里画一次：drawApple 里已经乘了 endLogoAlpha，
       而 animEnd 又按同一个进度淡出 —— 早前两处都调了一遍，
       等于把淡出乘了两次，logo 提前消失。 */
    if (s.id === 'end') {
      drawApple(local, 1 - easeInOut(seg(local, 6.4, 8.6)));
    }

    DRAW[s.id](local);

    const mm = String(Math.floor(time / 60)).padStart(2, '0');
    const ss = String(Math.floor(time % 60)).padStart(2, '0');
    tcEl.innerHTML = `<b>${mm}:${ss}</b>`;
    fill.style.width = ((time / TOTAL) * 100).toFixed(2) + '%';
    track.setAttribute('aria-valuenow', String(Math.round((time / TOTAL) * 100)));
  }

  /* ============================================================
     9. 播放控制
     ============================================================ */
  const ICON_PAUSE = '<svg viewBox="0 0 12 12" aria-hidden="true"><rect x="1.5" y="1" width="3" height="10" fill="currentColor"/><rect x="7.5" y="1" width="3" height="10" fill="currentColor"/></svg>';
  const ICON_PLAY = '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 1l9 5-9 5z" fill="currentColor"/></svg>';

  function setPlaying(v) {
    if (ended && v) { restart(); return; }
    playing = v;
    playBtn.innerHTML = v ? ICON_PAUSE : ICON_PLAY;
    playBtn.setAttribute('aria-label', v ? '暂停' : '播放');
    if (v) last = performance.now();
    wake();
  }

  function restart() {
    t = 0; ended = false; curIdx = -1;
    againBtn.classList.remove('on');
    SCENES.forEach(s => wrap(s.id).classList.remove('on'));
    playing = true;
    setPlaying(true);
    renderAt(0);
  }

  function jumpTo(i) {
    i = Math.max(0, Math.min(SCENES.length - 1, i));
    t = SCENES[i].start + 0.001;
    ended = false; curIdx = -1;
    againBtn.classList.remove('on');
    SCENES.forEach(s => wrap(s.id).classList.remove('on'));
    renderAt(t);
    if (playing) last = performance.now();
    wake();
  }

  function currentIndex() {
    for (let i = 0; i < SCENES.length; i++) {
      if (t < SCENES[i].start + SCENES[i].dur) return i;
    }
    return SCENES.length - 1;
  }

  let gp = 0;
  function loop(now) {
    const dt = Math.min((now - last) / 1000, 0.06);
    last = now;

    if (playing && !ended) {
      t += dt;
      if (t >= TOTAL) {
        t = TOTAL; ended = true; playing = false;
        againBtn.classList.add('on');
        playBtn.innerHTML = ICON_PLAY;
      }
      renderAt(t);
    }

    gp++;
    if (gp % 3 === 0) {
      grain.style.transform =
        `translate3d(${(Math.random() * 36 - 18) | 0}px,${(Math.random() * 36 - 18) | 0}px,0)`;
    }

    requestAnimationFrame(loop);
  }

  /* ============================================================
     10. 交互
     ============================================================ */
  playBtn.addEventListener('click', () => setPlaying(!playing));

  let idleTimer = 0;
  function wake() {
    $('#chrome').classList.remove('idle');
    chapEl.classList.remove('idle');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => {
      if (playing) { $('#chrome').classList.add('idle'); chapEl.classList.add('idle'); }
    }, 2600);
  }

  document.addEventListener('mousemove', wake);
  document.addEventListener('touchstart', wake, { passive: true });

  /* 第一次点击舞台＝用户手势，顺手开声音。
     ⚠️ 这次手势不能再触发「暂停」：两者叠在同一个 click 上时，
     用户点一下想开声音，片子反而停住（看起来像播放坏了）。
     用 consumeFirstGesture 吃掉紧随其后的那一次 click。 */
  let firstTouch = true;
  let consumeFirstGesture = false;
  stage.addEventListener('pointerdown', () => {
    if (!firstTouch) return;
    firstTouch = false;
    if (Sound.muted) {
      const nowMuted = Sound.toggle();
      muteBtn.classList.toggle('off', nowMuted);
      muteBtn.setAttribute('aria-label', nowMuted ? '开启声音' : '静音');
      consumeFirstGesture = true;
    }
  }, { capture: true });

  stage.addEventListener('click', (e) => {
    if (e.target.closest('#again')) return;
    if (consumeFirstGesture) { consumeFirstGesture = false; return; }
    setPlaying(!playing);
  });

  muteBtn.addEventListener('click', () => {
    const m = Sound.toggle();
    muteBtn.classList.toggle('off', m);
    muteBtn.setAttribute('aria-label', m ? '开启声音' : '静音');
  });

  againBtn.addEventListener('click', restart);

  // 进度条：点击 + 拖拽
  let dragging = false;
  function seekFromEvent(e) {
    const r = track.getBoundingClientRect();
    const ratio = clamp((e.clientX - r.left) / r.width);
    seeking = true;
    t = ratio * TOTAL;
    ended = false;
    againBtn.classList.remove('on');
    curIdx = -1;
    SCENES.forEach(s => wrap(s.id).classList.remove('on'));
    renderAt(t);
    seeking = false;
  }
  track.addEventListener('pointerdown', (e) => {
    dragging = true;
    track.setPointerCapture(e.pointerId);
    seekFromEvent(e);
  });
  track.addEventListener('pointermove', (e) => { if (dragging) seekFromEvent(e); });
  track.addEventListener('pointerup', (e) => {
    dragging = false;
    try { track.releasePointerCapture(e.pointerId); } catch { /* noop */ }
  });

  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space') {
      e.preventDefault();
      setPlaying(!playing);
    } else if (e.code === 'ArrowRight') {
      // 章节跳转语义：→ 永远去下一幕开头
      e.preventDefault();
      const i = currentIndex();
      if (i < SCENES.length - 1) jumpTo(i + 1);
      else jumpTo(i);
    } else if (e.code === 'ArrowLeft') {
      e.preventDefault();
      const i = currentIndex();
      const local = t - SCENES[i].start;
      if (local > 0.8 || i === 0) jumpTo(i);
      else jumpTo(i - 1);
    } else if (e.key === 'r' || e.key === 'R') {
      restart();
    }
  });

  // 进度条刻度
  (function () {
    const marks = $('#track .marks');
    SCENES.forEach((s, i) => {
      if (i === 0) return;
      const d = document.createElement('i');
      d.style.left = ((s.start / TOTAL) * 100).toFixed(3) + '%';
      marks.appendChild(d);
    });
  })();

  /* 竖屏提示 */
  function checkOrient() {
    rotateHint.classList.toggle('on', window.innerHeight > window.innerWidth * 1.25);
  }
  checkOrient();
  window.addEventListener('resize', checkOrient);

  /* ============================================================
     11. 启动
     ============================================================ */
  // 等照片就绪再开播：否则第三幕一进来就是空白框
  const ready = Promise.all(SHOTS.map(s => new Promise(res => {
    const img = new Image();
    img.onload = res;
    img.onerror = res;
    img.src = s.src;
  })));

  ready.then(() => {
    renderAt(0);
    requestAnimationFrame(loop);
    wake();
  });

  /* 调试钩子：便于自动化验收 */
  window.__bohFilm = {
    get total() { return TOTAL; },
    get scenes() { return SCENES.map(s => ({ id: s.id, start: s.start, dur: s.dur })); },
    seek(v) {
      t = clamp(v, 0, TOTAL);
      ended = false; curIdx = -1;
      againBtn.classList.remove('on');
      SCENES.forEach(s => wrap(s.id).classList.remove('on'));
      renderAt(t);
    },
    pause() { playing = false; playBtn.innerHTML = ICON_PLAY; },
    play() { setPlaying(true); },
  };
})();
</script>
</body>
</html>
